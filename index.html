<script>
// --- DATE ---
function todayDate(){ const d=new Date(); return d.toLocaleDateString(undefined,{day:'numeric',month:'short'}); }
document.getElementById('today-date').innerText=" "+todayDate();

// --- STORAGE ---
const storageKey='todayToolTasks';
let tasks=JSON.parse(localStorage.getItem(storageKey))||{today:[],next:[],someday:[],archive:[]};
function saveTasks(){ localStorage.setItem(storageKey,JSON.stringify(tasks)); }

const newCardsKey='newCards';
let newCards=JSON.parse(localStorage.getItem(newCardsKey))||[{title:'New Card',tasks:[]}];
let currentAdhoc=0;
function saveNewCards(){ localStorage.setItem(newCardsKey,JSON.stringify(newCards)); }

let hiddenCards={next:false,someday:false,archive:false,new:false};

// --- TODAY TEMP SORT STATE ---
let todaySortActive = false;
let todayTasksHidden = false;

let masterSearchQuery = '';

const somedayReviewKey = 'somedayLastReviewed';

// --- MASTER TOGGLE ---
const toggleBtn = document.getElementById('toggle-cards-btn');
function updateToggleBtn() {
    const anyHidden = hiddenCards.next || hiddenCards.someday || hiddenCards.archive || hiddenCards.new;
    toggleBtn.textContent = anyHidden ? 'Show All' : 'Focus Mode';
}
toggleBtn.addEventListener('click', function() {
    const anyHidden = hiddenCards.next || hiddenCards.someday || hiddenCards.archive || hiddenCards.new;
    if(anyHidden){ hiddenCards = { next:false,someday:false,archive:false,new:false }; }
    else { hiddenCards = { next:true,someday:true,archive:true,new:true }; }
    renderTasks();
    updateToggleBtn();
});
updateToggleBtn();

// --- TODAY SORT TOGGLE ---
const todaySortBtn = document.getElementById('today-sort-btn');
todaySortBtn.addEventListener('click', function(){
    todaySortActive = !todaySortActive;
    todaySortBtn.textContent = todaySortActive ? 'Unsort' : 'Sort A→Z';
    renderTasks();
});

// --- TODAY FOCUS MODE ---
const todayFocusBtn = document.getElementById('today-focus-btn');
todayFocusBtn.addEventListener('click', function(){
  todayTasksHidden = !todayTasksHidden;
  todayFocusBtn.textContent = todayTasksHidden ? 'show all tasks' : 'hide all tasks';
  renderTasks();
});

// --- INDIVIDUAL HIDE ---
function toggleHideCard(card){ hiddenCards[card]=!hiddenCards[card]; renderTasks(); }

// --- ADD TASK ---
function addTask(card){ 
  let input,text;
  if(card==='today'){ 
    input=document.getElementById('today-input'); 
    text=input.value.trim(); 
    if(!text) return; 
    tasks.today.push({text,status:'',highlighted:false,red:false}); 
    input.value=''; saveTasks(); renderTasks(); 
  }
  else if(card==='new'){ 
    input=document.getElementById('new-card-input'); 
    text=input.value.trim(); 
    if(!text) return; 
    newCards[currentAdhoc].tasks.push({text,status:'',highlighted:false,red:false}); 
    input.value=''; saveNewCards(); renderTasks(); 
  }
}
document.getElementById('today-input').addEventListener('keypress', e=>{ if(e.key==='Enter') addTask('today'); });
document.getElementById('new-card-input').addEventListener('keypress', e=>{ if(e.key==='Enter') addTask('new'); });

// --- SAVE NEW CARD TITLE ---
const newCardTitleInput = document.getElementById('new-card-title');
newCardTitleInput.addEventListener('input', function() {
  newCards[currentAdhoc].title = this.value.trim() || 'New Card';
  saveNewCards();
});

// --- HELP BUTTON ---
const helpBtn = document.getElementById('help-btn');
const helpOverlay = document.getElementById('help-overlay');
const closeHelp = document.getElementById('close-help');
helpBtn.addEventListener('click', ()=>{ helpOverlay.style.display='block'; });
closeHelp.addEventListener('click', ()=>{ helpOverlay.style.display='none'; });

const masterSearchInput = document.getElementById('master-search');
masterSearchInput.addEventListener('input', function(){
  masterSearchQuery = this.value.trim().toLowerCase();
  renderTasks();
});

// --- EXPORT / IMPORT ---
function exportTasksTxt(){
  const blob = new Blob([JSON.stringify({tasks,newCards})], {type: 'text/plain'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'todayToolTasks.txt';
  a.click();
}

function exportReadableTxt() {
  let text = '';

  // --- Standard cards ---
  for (let c in tasks) {
    text += `--- ${c.toUpperCase()} ---\n`;
    tasks[c].forEach((t, i) => {
      text += `${i + 1}. [${t.status || ' '}] ${t.text}`;
      if (t.highlighted) text += ' ⭐';
      if (t.red) text += ' 🔴';
      if (t.notes && t.notes.trim() !== '') text += `\n    Notes: ${t.notes}`;
      text += '\n';
    });
    text += '\n';
  }

  // --- New Cards ---
  newCards.forEach((card, idx) => {
    text += `--- NEW CARD: ${card.title} (${idx + 1}/${newCards.length}) ---\n`;
    card.tasks.forEach((t, i) => {
      text += `${i + 1}. [${t.status || ' '}] ${t.text}`;
      if (t.highlighted) text += ' ⭐';
      if (t.red) text += ' 🔴';
      if (t.notes && t.notes.trim() !== '') text += `\n    Notes: ${t.notes}`;
      text += '\n';
    });
    text += '\n';
  });

  const blob = new Blob([text], { type: 'text/plain' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'todayToolTasks_readable.txt';
  a.click();
}

function importTasksFile(){
  const input = document.createElement('input');
  input.type='file';
  input.accept='.txt';
  input.onchange=e=>{
    const file = e.target.files[0];
    const reader = new FileReader();
    reader.onload = function(ev){
      try{
        const imported = JSON.parse(ev.target.result);
        if(imported.tasks && imported.newCards){
          tasks = imported.tasks;
          newCards = imported.newCards;
          saveTasks();
          saveNewCards();
          renderTasks();
          alert('Tasks and new cards imported successfully!');
        } else {
          alert('Invalid file format. Make sure you exported using the Today Tool export.');
        }
      } catch(err){ 
        alert('Failed to import: '+err.message); 
      }
    };
    reader.readAsText(file);
  };
  input.click();
}

// --- RENDER ---
function renderTasks(){
  function createTaskDiv(taskObj, card, i, isNew=false){
    if(masterSearchQuery){
      const textMatch = taskObj.text.toLowerCase().includes(masterSearchQuery);
      const notesMatch = taskObj.notes && taskObj.notes.toLowerCase().includes(masterSearchQuery);
      if(!textMatch && !notesMatch){ return null; }
    }

    const taskDiv = document.createElement('div');
    taskDiv.className = 'task';
    if(taskObj.highlighted) taskDiv.classList.add('highlighted');
    if(taskObj.red) taskDiv.classList.add('red-highlighted');

    const topRow = document.createElement('div');
    topRow.className = 'task-top';

    const left = document.createElement('div');
    left.style.display = 'flex';
    left.style.alignItems = 'center';

    const circle = document.createElement('span');
    circle.className = 'circle';
    circle.textContent = taskObj.status==='completed'?'✓':taskObj.status==='inprogress'?'→':'•';
    if(taskObj.status==='completed'){ circle.classList.add('completed'); }

    const text = document.createElement('span');
    text.className = 'task-text';
    if(masterSearchQuery && taskObj.text.toLowerCase().includes(masterSearchQuery)){
      const regex = new RegExp(`(${masterSearchQuery})`, 'gi');
      text.innerHTML = taskObj.text.replace(regex, '<span style="background:#fff79a;">$1</span>');
    } else {
      text.textContent = taskObj.text;
    }
    if(taskObj.status==='completed'){ text.classList.add('completed'); }

    circle.onclick = function(e){
      e.stopPropagation();
      if(isNew){ toggleStatusNew(i); } else { toggleStatus(card,i); }
    };

    left.append(circle,text);
    topRow.append(left);

    const chevron = document.createElement('span');
    chevron.className = 'chevron';
    chevron.textContent='>';
    topRow.appendChild(chevron);

    const tb=document.createElement('div');
    tb.className='task-toolbar';

    if(card!=='archive'){
      const todayBtn=document.createElement('button'); todayBtn.textContent='T'; todayBtn.onclick=function(){ moveTask(isNew?'new':card,'today',i); };
      const nextBtn=document.createElement('button'); nextBtn.textContent='N'; nextBtn.onclick=function(){ moveTask(isNew?'new':card,'next',i); };
      const somedayBtn=document.createElement('button'); somedayBtn.textContent='S'; somedayBtn.onclick=function(){ moveTask(isNew?'new':card,'someday',i); };
      const delBtn=document.createElement('button'); delBtn.textContent='✕'; delBtn.onclick=function(){ moveTask(isNew?'new':card,'archive',i); };
      const highlightBtn=document.createElement('button'); highlightBtn.textContent='⭐'; highlightBtn.onclick=function(){ cycleHighlight(isNew?'new':card,i); };
      const editBtn=document.createElement('button'); editBtn.textContent='✎'; editBtn.onclick=function(){ 
        const newText=prompt('Edit task:',taskObj.text);
        if(newText && newText.trim()!==''){ taskObj.text=newText.trim(); if(card==='new'){saveNewCards();} else{saveTasks();} renderTasks(); }
      };
      const notesBtn=document.createElement('button'); notesBtn.textContent='📝'; notesBtn.onclick=function(e){
        e.stopPropagation();
        const currentNote = taskObj.notes || '';
        let newNote = prompt('Enter notes for this task:', currentNote);
        if(newNote!==null){ taskObj.notes=newNote.trim(); if(card==='new'){saveNewCards();} else{saveTasks();} renderTasks(); }
      };
      tb.append(todayBtn,nextBtn,somedayBtn,highlightBtn,editBtn,notesBtn,delBtn);
    } else {
      ['today','next','someday'].forEach(dest=>{
        const b=document.createElement('button'); b.textContent=dest[0].toUpperCase(); b.onclick=function(){ moveTask('archive',dest,i); };
        tb.appendChild(b);
      });
      const delBtn=document.createElement('button'); delBtn.textContent='✕'; delBtn.onclick=function(){ deleteTask('archive',i); };
      const highlightBtn=document.createElement('button'); highlightBtn.textContent='⭐'; highlightBtn.onclick=function(){ cycleHighlight('archive',i); };
      tb.append(delBtn,highlightBtn);
    }

    topRow.onclick=function(){ tb.style.display=tb.style.display==='flex'?'none':'flex'; chevron.style.transform=tb.style.display==='flex'?'rotate(90deg)':'rotate(0deg)'; };
    taskDiv.append(topRow,tb);

    if(taskObj.notes && taskObj.notes.trim()!==''){
      const notesDiv=document.createElement('div'); notesDiv.className='task-notes';
      const maxLength=60;
      if(taskObj.notes.length>maxLength){
        const preview=taskObj.notes.slice(0,maxLength)+'... ';
        const viewFull=document.createElement('a'); viewFull.textContent='(view full)';
        viewFull.onclick=function(e){ e.stopPropagation(); const fullNote=prompt('Full note:',taskObj.notes); if(fullNote!==null){ taskObj.notes=fullNote.trim(); if(card==='new'){saveNewCards();} else{saveTasks();} renderTasks(); } };
        notesDiv.textContent=preview;
        notesDiv.appendChild(viewFull);
      } else {
        notesDiv.textContent=taskObj.notes;
      }
      taskDiv.appendChild(notesDiv);
    }

    return taskDiv;
  }

  // --- STANDARD CARDS ---
  ['today','next','someday','archive'].forEach(card=>{
    const c=document.getElementById(card+'-card');
    const container=document.getElementById(card+'-tasks');
    container.innerHTML='';
    if(card!=='today'){ c.style.display=hiddenCards[card]?'none':'flex'; }
    if(card==='today'){ document.getElementById('today-tasks').style.display = todayTasksHidden ? 'none':'block'; }
    if(card==='today' && todaySortActive){
      const sorted = tasks.today.map((t,i)=>({task:t,originalIndex:i})).sort((a,b)=>a.task.text.localeCompare(b.task.text));
      sorted.forEach(item=>{ const el=createTaskDiv(item.task,'today',item.originalIndex); if(el) container.appendChild(el); });
    } else { tasks[card].forEach((t,i)=>{ const el=createTaskDiv(t,card,i); if(el) container.appendChild(el); }); }
  });

  // --- TODAY TASK SUMMARY ---
  const todaySummaryDiv=document.getElementById('today-summary');
  const todayTasksArr=tasks.today;
  const pending=todayTasksArr.filter(t=>t.status==='').length;
  const inProgress=todayTasksArr.filter(t=>t.status==='inprogress').length;
  const completed=todayTasksArr.filter(t=>t.status==='completed').length;
  todaySummaryDiv.textContent=`• ${pending}   → ${inProgress}   ✓ ${completed}`;

  // --- NEW CARD ---
  const nc=document.getElementById('new-card'); 
  const ncTasks=document.getElementById('new-card-tasks'); 
  ncTasks.innerHTML=''; 
  nc.style.display=hiddenCards.new?'none':'flex';
  const cardData=newCards[currentAdhoc]; 
  document.getElementById('new-card-title').value=cardData.title;
  cardData.tasks.forEach((t,i)=>{ const el=createTaskDiv(t,'new',i,true); if(el) ncTasks.appendChild(el); });
  document.querySelector('.new-card-index').textContent=`Card ${currentAdhoc+1}/${newCards.length}`;

  // --- SEARCH INFO ---
  function updateMasterSearchInfo(){
    if(!masterSearchQuery){ document.getElementById('master-search-info').textContent=''; return; }
    const cardKeys=['today','next','someday','archive','new'];
    const counts={};
    let totalMatches=0;
    cardKeys.forEach(card=>{
      let taskArray;
      if(card==='new'){ taskArray=newCards.flatMap(c=>c.tasks); } else { taskArray=tasks[card]; }
      counts[card]=taskArray.filter(t=>{ const textMatch=t.text.toLowerCase().includes(masterSearchQuery); const notesMatch=t.notes && t.notes.toLowerCase().includes(masterSearchQuery); return textMatch || notesMatch; }).length;
      totalMatches+=counts[card];
    });
    const display=`Total: ${totalMatches} | Today: ${counts.today}, Next: ${counts.next}, Someday: ${counts.someday}, Archive: ${counts.archive}, New: ${counts.new}`;
    document.getElementById('master-search-info').textContent=display;
  }
  updateMasterSearchInfo();
}

// --- TASK ACTIONS ---
function toggleStatus(card,i){ const t=tasks[card][i]; t.status=t.status==='completed'?'':t.status==='inprogress'?'completed':'inprogress'; saveTasks(); renderTasks(); }
function toggleStatusNew(i){ const t=newCards[currentAdhoc].tasks[i]; t.status=t.status==='completed'?'':t.status==='inprogress'?'completed':'inprogress'; saveNewCards(); renderTasks(); }
function moveTask(from,to,i){ let item; if(from==='new'){ item=newCards[currentAdhoc].tasks.splice(i,1)[0]; if(to==='today'||to==='next'||to==='someday') tasks[to].push(item); else if(to==='archive') tasks.archive.push(item); saveTasks(); saveNewCards(); } else { item=tasks[from].splice(i,1)[0]; tasks[to].push(item); saveTasks(); } renderTasks(); }
function deleteTask(card,i){ tasks[card].splice(i,1); saveTasks(); renderTasks(); }
function cycleHighlight(card,i){ let t=card==='new'?newCards[currentAdhoc].tasks[i]:tasks[card][i]; if(!t.highlighted&&!t.red){ t.highlighted=true;t.red=false; } else if(t.highlighted&&!t.red){ t.highlighted=false;t.red=true; } else { t.highlighted=false;t.red=false; } if(card==='new'){saveNewCards();} else{saveTasks();} renderTasks(); }

// --- NEW CARDS NAV ---
function createNewCard(){ newCards.push({title:'New Card',tasks:[]}); currentAdhoc=newCards.length-1; saveNewCards(); renderTasks(); }
function nextNewCard(){ currentAdhoc=(currentAdhoc+1)%newCards.length; renderTasks(); }
function prevNewCard(){ currentAdhoc=(currentAdhoc-1+newCards.length)%newCards.length; renderTasks(); }

// --- Someday Timestamp ---
const somedayTimestampBtn=document.getElementById('someday-timestamp-btn');
const somedayTimestampSpan=document.getElementById('someday-timestamp');
const savedReview=localStorage.getItem(somedayReviewKey);
if(savedReview){ somedayTimestampSpan.textContent=savedReview; }
somedayTimestampBtn.addEventListener('click', ()=>{
  const d=new Date();
  const day=String(d.getDate()).padStart(2,'0');
  const month=String(d.getMonth()+1).padStart(2,'0');
  const hour=String(d.getHours()).padStart(2,'0');
  const minutes=String(d.getMinutes()).padStart(2,'0');
  const text=`Last reviewed: ${day}.${month} ${hour}:${minutes}`;
  somedayTimestampSpan.textContent=text;
  localStorage.setItem(somedayReviewKey,text);
});

renderTasks();

// --- MASTER SEARCH SHORTCUT ---
document.addEventListener('keydown', function(e){
  if(e.ctrlKey && e.key==='/'){ masterSearchInput.focus(); }
});
</script>
