<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Today Tool - v1.4.1</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }

body {
  background: #f4f4f4;
  padding: 20px;
  display: flex;
  gap: 20px;
  flex-wrap: wrap;
}

/* ===== Sidebar ===== */
.sidebar {
  width: 220px;
  background: #ffffff;
  border-radius: 12px;
  padding: 16px;
  box-shadow: 0 6px 18px rgba(0,0,0,0.12);
  transition: transform 0.3s ease;
  flex-shrink: 0;
  z-index: 999;
}

.sidebar.collapsed {
  transform: translateX(-240px);
}

.sidebar h3 {
  margin-bottom: 12px;
  font-size: 0.9rem;
  color: #666;
}

.sidebar label {
  display: flex;
  align-items: center;
  margin-bottom: 8px;
  font-size: 0.9rem;
  cursor: pointer;
  gap: 6px;
}

.sidebar button {
  margin-top: 10px;
  padding: 6px 10px;
  border: none;
  border-radius: 6px;
  background: #333;
  color: #fff;
  cursor: pointer;
  font-size: 0.8rem;
}

.hamburger {
  position: fixed;
  top: 20px;
  left: 20px;
  font-size: 20px;
  cursor: pointer;
  z-index: 1000;
}

/* ===== Cards Layout Wrapper ===== */
.main {
  display: flex;
  gap: 20px;
  flex-wrap: wrap;
}

/* ===== Cards ===== */
.card {
  width: 300px;
  border-radius: 12px;
  padding: 16px;
  display: flex;
  flex-direction: column;
  gap: 8px;
  position: relative;
  box-shadow: 0 6px 18px rgba(0,0,0,0.12);
  overflow: hidden;
}

/* Paper texture */
.card::before {
  content: "";
  position: absolute;
  inset: 0;
  background: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100"><rect width="100" height="100" fill="none" stroke="%23e0e0e0" stroke-width="1"/></svg>') repeat;
  opacity: 0.03;
  pointer-events: none;
}

/* Dot grids */
.today { background-color: #ffffff; background-image: radial-gradient(rgba(0,0,0,0.12) 1px, transparent 1px); background-size: 18px 18px; }
.next { background-color: #dffcf0; background-image: radial-gradient(rgba(0,0,0,0.12) 1px, transparent 1px); background-size: 18px 18px; }
.someday { background-color: #c8f7e2; background-image: radial-gradient(rgba(0,0,0,0.12) 1px, transparent 1px); background-size: 18px 18px; }
.archive { background-color: #a0d9b7; background-image: radial-gradient(rgba(0,0,0,0.12) 1px, transparent 1px); background-size: 18px 18px; }

@import url('https://fonts.googleapis.com/css2?family=Patrick+Hand&display=swap');
.card h2 { font-family: 'Patrick Hand', cursive; font-size: 1.05rem; color: #666; display: flex; justify-content: space-between; align-items: center; }
.card h2 .first { font-weight: bold; color: #666; }
.card h2 .rest { opacity: 0.3; font-weight: normal; }
#today-date { font-size: 0.8rem; color: #888; margin-left: 6px; }

.task-list { flex: 1; min-height: 400px; max-height: 400px; overflow-y: auto; }
.task { display: flex; flex-direction: column; padding: 6px 4px; margin-bottom: 2px; }
.task-top { display: flex; align-items: center; }
.circle { width: 18px; height: 18px; border-radius: 50%; border: 2px solid #999; margin-right: 6px; flex-shrink: 0; cursor: pointer; display: inline-flex; align-items:center; justify-content:center; font-size:12px; font-weight:bold; transition: all 0.2s ease; background: #fff; color: #333; }
.task-text { flex: 1; word-break: break-word; font-size: 0.9rem; }
.task-buttons { margin-top: 1px; margin-left: 24px; }
.task-buttons button { margin-right: 6px; padding: 0; font-size: 0.7rem; border: none; background: none; opacity: 0.5; cursor: pointer; transition: opacity 0.15s ease; }
.task:hover .task-buttons button { opacity: 0.8; }
.delete-btn { margin-left: 4px; padding: 0; font-size: 0.65rem; border: none; background: none; color: #900; opacity: 0.5; cursor: pointer; }
.task:hover .delete-btn { opacity: 0.8; }
.add-task { display: flex; gap: 4px; margin-top: 8px; position: relative; }
.add-task input { flex: 1; padding: 6px 8px; border: 1px solid #ccc; border-radius: 6px; }
.add-task button { padding: 6px 12px; border: none; border-radius: 6px; background: #333; color: #fff; cursor: pointer; }
.add-task button:hover { background: #555; }
.archive-tools { display: flex; gap: 8px; }
.archive-tools button { background: none; border: none; font-size: 12px; cursor: pointer; opacity: 0.6; padding: 0; }
.archive-tools button:hover { opacity: 1; }
.highlighted { background-color: #fff79a; color: #000; }

/* ===== Responsive Layer ===== */
@media (max-width: 768px) {
  body { padding: 12px; }
  .main { flex-direction: column; gap: 12px; }
  .card { width: 100%; max-width: 100%; }
  .sidebar { position: fixed; top: 0; left: 0; height: 100%; transform: translateX(-240px); z-index: 1000; }
  .sidebar.collapsed { transform: translateX(-240px); }
  .sidebar.show { transform: translateX(0); }
}
</style>
</head>
<body>

<div class="hamburger" onclick="toggleSidebar()">☰</div>

<div class="sidebar" id="sidebar">
  <h3>Cards</h3>
  <label><input type="checkbox" data-card="today" checked> Today</label>
  <label><input type="checkbox" data-card="next" checked> Next</label>
  <label><input type="checkbox" data-card="someday" checked> Someday</label>
  <label><input type="checkbox" data-card="archive" checked> Archive</label>
  <button onclick="showAllCards()">Show All</button>
</div>

<div class="main">

<div class="card today" id="today-card">
  <h2>
    <span><span class="first">T</span><span class="rest">oday</span><span id="today-date"></span></span>
  </h2>
  <div class="task-list" id="today-tasks"></div>
  <div class="add-task">
    <input type="text" placeholder="New task..." id="today-input">
    <button onclick="addTask('today')">Add</button>
  </div>
</div>

<div class="card next" id="next-card">
  <h2><span><span class="first">N</span><span class="rest">ext</span></span></h2>
  <div class="task-list" id="next-tasks"></div>
</div>

<div class="card someday" id="someday-card">
  <h2><span><span class="first">S</span><span class="rest">omeday</span></span></h2>
  <div class="task-list" id="someday-tasks"></div>
</div>

<div class="card archive" id="archive-card">
  <h2>
    Archive
    <span class="archive-tools">
      <button onclick="exportTasksTxt()">Export</button>
      <button onclick="importTasksTxt()">Import</button>
    </span>
  </h2>
  <div class="task-list" id="archive-tasks"></div>
</div>

</div>

<script>
// ===== Original Task & Sidebar Logic (UNCHANGED) =====

// Task logic (render/add/move/delete/highlight) remains as in v1.4.0

// Sidebar toggle for mobile
function toggleSidebar(){
  const sidebar=document.getElementById('sidebar');
  if(window.innerWidth<=768){
    sidebar.classList.toggle('show');
  }else{
    sidebar.classList.toggle('collapsed');
  }
  saveSidebarState();
}

// Rest of sidebar & task logic from v1.4.0 remains unchanged
</script>
</body>
</html>
