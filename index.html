<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Today Tool - v1.4.5</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
body { background: #f4f4f4; padding: 20px; display: flex; justify-content: center; flex-wrap: wrap; gap: 20px; }

.card { 
  width: 300px; 
  height: 420px;
  border-radius: 12px; 
  padding: 16px; 
  display: flex; 
  flex-direction: column; 
  gap: 8px; 
  position: relative; 
  box-shadow: 0 6px 18px rgba(0,0,0,0.12); 
  overflow: hidden; 
}

.card::before { 
  content: ""; 
  position: absolute; 
  inset: 0; 
  background: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100"><rect width="100" height="100" fill="none" stroke="%23e0e0e0" stroke-width="1"/></svg>') repeat; 
  opacity: 0.03; 
  pointer-events: none; 
}

.today { background-color: #ffffff; background-image: linear-gradient(to bottom, rgba(0,0,0,0.08) 1px, transparent 1px); background-size: 1px 24px; }
.next, .new-card { background-color: #dffcf0; background-image: linear-gradient(to bottom, rgba(0,0,0,0.08) 1px, transparent 1px); background-size: 1px 24px; }
.someday { background-color: #c8f7e2; background-image: linear-gradient(to bottom, rgba(0,0,0,0.08) 1px, transparent 1px); background-size: 1px 24px; }
.archive { background-color: #a0d9b7; background-image: linear-gradient(to bottom, rgba(0,0,0,0.08) 1px, transparent 1px); background-size: 1px 24px; }

@import url('https://fonts.googleapis.com/css2?family=Patrick+Hand&display=swap');
.card h2 { font-family: 'Patrick Hand', cursive; font-size: 1.05rem; color: #666; display: flex; justify-content: space-between; align-items: center; }
.card h2 .first { font-weight: bold; color: #666; }
.card h2 .rest { opacity: 0.3; font-weight: normal; }
#today-date { font-size: 0.8rem; color: #888; margin-left: 6px; }

.task-list { flex: 1; overflow-y: auto; padding-right: 4px; }
.task-list::-webkit-scrollbar { width: 6px; }
.task-list::-webkit-scrollbar-thumb { background-color: rgba(0,0,0,0.2); border-radius: 3px; }

.task { display: flex; flex-direction: column; padding: 6px 4px; margin-bottom: 2px; cursor: pointer; }
.task-top { display: flex; align-items: center; justify-content: space-between; }
.circle { width: 18px; height: 18px; border-radius: 50%; border: 2px solid #999; margin-right: 6px; display: inline-flex; align-items:center; justify-content:center; font-size:12px; font-weight:bold; background:#fff; }
.task-text { flex: 1; word-break: break-word; font-size: 0.9rem; }
.task-toolbar { display: none; margin-left: 24px; margin-top: 2px; gap: 6px; }
.task-toolbar button { font-size: 0.7rem; border: none; background: none; opacity: 0.5; cursor: pointer; }
.task-toolbar button:hover { opacity: 0.8; }
.chevron { font-size: 12px; margin-left: 6px; transition: transform 0.2s ease; }

.add-task { display: flex; gap: 4px; margin-top: 8px; }
.add-task input { flex: 1; padding: 6px 8px; border: 1px solid #ccc; border-radius: 6px; }
.add-task button { padding: 6px 12px; border: none; border-radius: 6px; background: #333; color: #fff; cursor: pointer; }

.switch { position: relative; display: inline-block; width: 40px; height: 20px; }
.switch input { opacity: 0; width: 0; height: 0; }
.slider { position: absolute; cursor: pointer; inset: 0; background-color: #ccc; border-radius: 12px; transition: .2s; }
.slider:before { position: absolute; content: ""; height: 14px; width: 14px; left: 3px; bottom: 3px; background-color: white; border-radius: 50%; transition: .2s; }
input:checked + .slider { background-color: #4caf50; }
input:checked + .slider:before { transform: translateX(20px); }

.archive-tools { display: flex; gap: 8px; }
.archive-tools button { background: none; border: none; font-size: 12px; cursor: pointer; opacity: 0.6; }
.archive-tools button:hover { opacity: 1; }

.highlighted { background-color: #fff79a; }
</style>
</head>
<body>

<!-- Cards (unchanged structure) -->
<!-- Today -->
<div class="card today">
  <h2>
    <span><span class="first">T</span><span class="rest">oday</span><span id="today-date"></span></span>
    <label class="switch">
      <input type="checkbox" id="toggle-cards" checked>
      <span class="slider"></span>
    </label>
  </h2>
  <div class="task-list" id="today-tasks"></div>
  <div class="add-task">
    <input type="text" id="today-input">
    <button onclick="addTask('today')">Add</button>
  </div>
</div>

<!-- Next -->
<div class="card next" id="next-card">
  <h2><span><span class="first">N</span><span class="rest">ext</span></span>
    <span class="archive-tools"><button onclick="toggleHideCard('next')">hide</button></span>
  </h2>
  <div class="task-list" id="next-tasks"></div>
</div>

<!-- Someday -->
<div class="card someday" id="someday-card">
  <h2><span><span class="first">S</span><span class="rest">omeday</span></span>
    <span class="archive-tools"><button onclick="toggleHideCard('someday')">hide</button></span>
  </h2>
  <div class="task-list" id="someday-tasks"></div>
</div>

<!-- Archive -->
<div class="card archive" id="archive-card">
  <h2>
    Archive
    <span class="archive-tools">
      <button onclick="exportTasksTxt()">Export</button>
      <button onclick="importTasksTxt()">Import</button>
      <button onclick="toggleHideCard('archive')">hide</button>
    </span>
  </h2>
  <div class="task-list" id="archive-tasks"></div>
</div>

<!-- New Card -->
<div class="card new-card" id="new-card">
  <h2>
    <input type="text" id="new-card-title" value="New Card" style="border:none;background:none;font-family:'Patrick Hand',cursive;font-size:1rem;width:150px;">
    <span class="archive-tools">
      <button onclick="toggleHideCard('new')">hide</button>
      <button onclick="prevNewCard()">Prev</button>
      <button onclick="nextNewCard()">Next</button>
      <button onclick="createNewCard()">New Card</button>
    </span>
  </h2>
  <div class="task-list" id="new-card-tasks"></div>
  <div class="add-task">
    <input type="text" id="new-card-input">
    <button onclick="addTask('new')">Add</button>
  </div>
</div>

<script>
// FULL WORKING LOGIC
// (Complete restored version including renderTasks)

const storageKey='todayToolTasks';
let tasks=JSON.parse(localStorage.getItem(storageKey))||{today:[],next:[],someday:[],archive:[]};
function saveTasks(){localStorage.setItem(storageKey,JSON.stringify(tasks));}

const newCardsKey='newCards';
let newCards=JSON.parse(localStorage.getItem(newCardsKey))||[{title:'New Card',tasks:[]}];
let currentAdhoc=0;
function saveNewCards(){localStorage.setItem(newCardsKey,JSON.stringify(newCards));}

let hiddenCards={next:false,someday:false,archive:false,new:false};

document.getElementById('toggle-cards').addEventListener('change',function(){
if(this.checked){hiddenCards={next:false,someday:false,archive:false,new:false};}
renderTasks();});

function toggleHideCard(card){hiddenCards[card]=!hiddenCards[card];renderTasks();}

function addTask(card){
if(card==='today'){
let input=document.getElementById('today-input');
if(!input.value.trim())return;
tasks.today.push({text:input.value,status:'',highlighted:false});
input.value='';saveTasks();renderTasks();}
else if(card==='new'){
let input=document.getElementById('new-card-input');
if(!input.value.trim())return;
newCards[currentAdhoc].tasks.push({text:input.value,status:'',highlighted:false});
input.value='';saveNewCards();renderTasks();}
}

function moveTask(from,to,i){let t=tasks[from].splice(i,1)[0];tasks[to].push(t);saveTasks();renderTasks();}
function deleteTask(card,i){tasks[card].splice(i,1);saveTasks();renderTasks();}
function toggleStatus(card,i){let s=['','inprogress','completed'];let c=tasks[card][i].status;tasks[card][i].status=s[(s.indexOf(c)+1)%3];saveTasks();renderTasks();}
function toggleHighlight(card,i){tasks[card][i].highlighted=!tasks[card][i].highlighted;saveTasks();renderTasks();}

function moveTaskNewToExisting(t,i){let task=newCards[currentAdhoc].tasks.splice(i,1)[0];tasks[t].push(task);saveTasks();saveNewCards();renderTasks();}
function toggleStatusNew(i){let s=['','inprogress','completed'];let c=newCards[currentAdhoc].tasks[i].status;newCards[currentAdhoc].tasks[i].status=s[(s.indexOf(c)+1)%3];saveNewCards();renderTasks();}
function toggleHighlightNew(i){newCards[currentAdhoc].tasks[i].highlighted=!newCards[currentAdhoc].tasks[i].highlighted;saveNewCards();renderTasks();}
function createNewCard(){newCards.push({title:'New Card',tasks:[]});currentAdhoc=newCards.length-1;saveNewCards();renderTasks();}
function prevNewCard(){if(currentAdhoc>0){currentAdhoc--;renderTasks();}}
function nextNewCard(){if(currentAdhoc<newCards.length-1){currentAdhoc++;renderTasks();}}

function exportTasksTxt(){let blob=new Blob([JSON.stringify({tasks,newCards},null,2)],{type:'text/plain'});let a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='today-tool-backup.txt';a.click();}
function importTasksTxt(){let input=document.createElement('input');input.type='file';input.accept='.txt';input.onchange=e=>{let r=new FileReader();r.onload=f=>{let d=JSON.parse(f.target.result);tasks=d.tasks||tasks;newCards=d.newCards||newCards;saveTasks();saveNewCards();renderTasks();};r.readAsText(e.target.files[0]);};input.click();}

function renderTasks(){
['today','next','someday','archive'].forEach(card=>{
let container=document.getElementById(card+'-tasks');container.innerHTML='';
let el=document.getElementById(card+'-card');
if(card!=='today'){el.style.display=(hiddenCards[card]||!document.getElementById('toggle-cards').checked)?'none':'flex';}
tasks[card].forEach((task,i)=>{
let div=document.createElement('div');div.className='task';
if(task.highlighted)div.classList.add('highlighted');
let top=document.createElement('div');top.className='task-top';
let left=document.createElement('div');left.style.display='flex';left.style.alignItems='center';
let circle=document.createElement('span');circle.className='circle';
circle.textContent=task.status==='completed'?'✓':task.status==='inprogress'?'→':'•';
circle.onclick=()=>toggleStatus(card,i);
let text=document.createElement('span');text.className='task-text';text.textContent=task.text;
left.append(circle,text);
let chev=document.createElement('span');chev.className='chevron';chev.textContent='>';
top.append(left,chev);
let tb=document.createElement('div');tb.className='task-toolbar';
let h=document.createElement('button');h.textContent='⭐';h.onclick=()=>toggleHighlight(card,i);
let del=document.createElement('button');del.textContent='✕';
if(card==='archive'){del.onclick=()=>deleteTask(card,i);}else{del.onclick=()=>moveTask(card,'archive',i);}
tb.append(h,del);
chev.onclick=e=>{e.stopPropagation();tb.style.display=tb.style.display==='flex'?'none':'flex';};
div.onclick=()=>{tb.style.display=tb.style.display==='flex'?'none':'flex';};
div.append(top,tb);container.appendChild(div);
});});

let nc=document.getElementById('new-card-tasks');nc.innerHTML='';
let newEl=document.getElementById('new-card');
newEl.style.display=(hiddenCards.new||!document.getElementById('toggle-cards').checked)?'none':'flex';
document.getElementById('new-card-title').value=newCards[currentAdhoc].title;

newCards[currentAdhoc].tasks.forEach((task,i)=>{
let div=document.createElement('div');div.className='task';
if(task.highlighted)div.classList.add('highlighted');
let top=document.createElement('div');top.className='task-top';
let left=document.createElement('div');left.style.display='flex';left.style.alignItems='center';
let circle=document.createElement('span');circle.className='circle';
circle.textContent=task.status==='completed'?'✓':task.status==='inprogress'?'→':'•';
circle.onclick=()=>toggleStatusNew(i);
let text=document.createElement('span');text.className='task-text';text.textContent=task.text;
left.append(circle,text);
let chev=document.createElement('span');chev.className='chevron';chev.textContent='>';
top.append(left,chev);
let tb=document.createElement('div');tb.className='task-toolbar';
let h=document.createElement('button');h.textContent='⭐';h.onclick=()=>toggleHighlightNew(i);
let del=document.createElement('button');del.textContent='✕';del.onclick=()=>moveTaskNewToExisting('archive',i);
tb.append(h,del);
chev.onclick=e=>{e.stopPropagation();tb.style.display=tb.style.display==='flex'?'none':'flex';};
div.onclick=()=>{tb.style.display=tb.style.display==='flex'?'none':'flex';};
div.append(top,tb);nc.appendChild(div);
});
}

renderTasks();
</script>

</body>
</html>
