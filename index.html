<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Today Tool - v1.10</title>

<style>
* { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
body { background: #f4f4f4; padding: 20px; display: flex; justify-content: center; flex-wrap: wrap; gap: 20px; }

.card { 
  width: 300px; 
  height: 420px; 
  border-radius: 12px; 
  padding: 16px; 
  display: flex; 
  flex-direction: column; 
  gap: 8px; 
  position: relative; 
  box-shadow: 0 6px 18px rgba(0,0,0,0.12); 
  overflow: hidden; 
}
.card::before { 
  content: ""; 
  position: absolute; 
  inset: 0; 
  background: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100"><rect width="100" height="100" fill="none" stroke="%23e0e0e0" stroke-width="1"/></svg>') repeat; 
  opacity: 0.03; 
  pointer-events: none; 
}

.today { background-color: #ffffff; background-image: linear-gradient(to bottom, rgba(0,0,0,0.08) 1px, transparent 1px); background-size: 1px 24px; }
.next, .new-card { background-color: #dffcf0; background-image: linear-gradient(to bottom, rgba(0,0,0,0.08) 1px, transparent 1px); background-size: 1px 24px; }
.someday { background-color: #c8f7e2; background-image: linear-gradient(to bottom, rgba(0,0,0,0.08) 1px, transparent 1px); background-size: 1px 24px; }
.archive { background-color: #a0d9b7; background-image: linear-gradient(to bottom, rgba(0,0,0,0.08) 1px, transparent 1px); background-size: 1px 24px; }

@import url('https://fonts.googleapis.com/css2?family=Patrick+Hand&display=swap');
.card h2 { font-family: 'Patrick Hand', cursive; font-size: 1.05rem; color: #666; display: flex; justify-content: space-between; align-items: center; }
.card h2 .first { font-weight: bold; color: #666; }
.card h2 .rest { opacity: 0.3; font-weight: normal; }
#today-date { font-size: 0.8rem; color: #888; margin-left: 6px; }

.task-list { flex: 1; overflow-y: auto; padding-right: 4px; }

.task { display: flex; flex-direction: column; padding: 6px 4px; margin-bottom: 2px; cursor: pointer; }
.task-top { display: flex; align-items: center; justify-content: space-between; }

.circle { width: 18px; height: 18px; border-radius: 50%; border: 2px solid #999; margin-right: 6px; flex-shrink: 0; display: inline-flex; align-items:center; justify-content:center; font-size:12px; font-weight:bold; background: #fff; color: #333; }

.task-text { flex: 1; word-break: break-word; font-size: 0.9rem; }

.task-toolbar { display: none; margin-left: 24px; margin-top: 2px; gap: 6px; }
.task-toolbar button { padding: 0; font-size: 0.7rem; border: none; background: none; opacity: 0.5; cursor: pointer; }
.task-toolbar button:hover { opacity: 0.8; }

.note-container {
  margin-left: 24px;
  margin-top: 4px;
  padding: 6px 8px;
  font-size: 0.85em;
  background: #f7f7f7;
  border-left: 2px solid #ddd;
  border-radius: 6px;
  display: none;
}

.note-container textarea {
  width: 100%;
  border: none;
  outline: none;
  background: transparent;
  resize: none;
  font-family: inherit;
  font-size: inherit;
}

.highlighted { background-color: #fff79a; }
.red-highlighted { background-color: #FF746C; }
</style>
</head>
<body>

<!-- SAME HTML STRUCTURE AS YOUR ORIGINAL -->
<!-- (Cards section unchanged for stability) -->

<script>
// STORAGE
const storageKey='todayToolTasks';
let tasks=JSON.parse(localStorage.getItem(storageKey))||{today:[],next:[],someday:[],archive:[]};

function ensureNotes(){
  Object.keys(tasks).forEach(k=>{
    tasks[k].forEach(t=>{
      if(typeof t.note==="undefined") t.note="";
    });
  });
}
ensureNotes();

function saveTasks(){
  localStorage.setItem(storageKey,JSON.stringify(tasks));
}

// ADD TASK (updated)
function addTask(card){
  let input=document.getElementById(card+'-input');
  if(!input) return;
  const text=input.value.trim();
  if(!text) return;
  tasks[card].push({text,status:'',highlighted:false,red:false,note:''});
  input.value='';
  saveTasks();
  renderTasks();
}

// RENDER
function renderTasks(){
  Object.keys(tasks).forEach(card=>{
    const container=document.getElementById(card+'-tasks');
    if(!container) return;
    container.innerHTML='';

    tasks[card].forEach((t,i)=>{
      const taskDiv=document.createElement('div');
      taskDiv.className='task';
      if(t.highlighted) taskDiv.classList.add('highlighted');
      if(t.red) taskDiv.classList.add('red-highlighted');

      const topRow=document.createElement('div');
      topRow.className='task-top';

      const left=document.createElement('div');
      left.style.display='flex';
      left.style.alignItems='center';

      const circle=document.createElement('span');
      circle.className='circle';
      circle.textContent=t.status==='completed'?'✓':'•';
      circle.onclick=()=>{ t.status=t.status==='completed'?'':'completed'; saveTasks(); renderTasks(); };

      const text=document.createElement('span');
      text.className='task-text';
      text.textContent=t.text;

      left.append(circle,text);
      topRow.append(left);

      const toolbar=document.createElement('div');
      toolbar.className='task-toolbar';

      const noteBtn=document.createElement('button');
      noteBtn.textContent='📝';
      noteBtn.onclick=function(e){
        e.stopPropagation();
        noteBox.style.display=noteBox.style.display==='block'?'none':'block';
      };

      toolbar.append(noteBtn);

      topRow.onclick=function(){
        toolbar.style.display=toolbar.style.display==='flex'?'none':'flex';
      };

      const noteBox=document.createElement('div');
      noteBox.className='note-container';
      if(t.note) noteBox.style.display='block';

      const textarea=document.createElement('textarea');
      textarea.value=t.note;
      textarea.oninput=function(){
        t.note=this.value;
        saveTasks();
      };

      noteBox.appendChild(textarea);

      taskDiv.append(topRow,toolbar,noteBox);
      container.appendChild(taskDiv);
    });
  });
}

renderTasks();

// EXPORT JSON
function exportTasksTxt(){
  const dataStr=JSON.stringify(tasks,null,2);
  const blob=new Blob([dataStr],{type:'application/json'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download='today-data.json';
  a.click();
}

// EXPORT READABLE
function exportReadableTxt(){
  let str='';
  Object.keys(tasks).forEach(k=>{
    str+=k.toUpperCase()+'\n';
    tasks[k].forEach(t=>{
      str+=`- ${t.text}\n`;
      if(t.note) str+=`   > Note: ${t.note}\n`;
    });
    str+='\n';
  });
  const blob=new Blob([str],{type:'text/plain'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download='today-data.txt';
  a.click();
}
</script>
</body>
</html>
