<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Today</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
body { background: #f4f4f4; padding: 20px; display: flex; justify-content: center; flex-wrap: wrap; gap: 20px; }

.card { 
  width: 300px; 
  height: 420px; 
  border-radius: 12px; 
  padding: 16px; 
  display: flex; 
  flex-direction: column; 
  gap: 8px; 
  position: relative; 
  box-shadow: 0 6px 18px rgba(0,0,0,0.12); 
  overflow: hidden; 
}
.card::before { 
  content: ""; 
  position: absolute; 
  inset: 0; 
  background: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100"><rect width="100" height="100" fill="none" stroke="%23e0e0e0" stroke-width="1"/></svg>') repeat; 
  opacity: 0.03; 
  pointer-events: none; 
}

.today { background-color: #ffffff; background-image: linear-gradient(to bottom, rgba(0,0,0,0.08) 1px, transparent 1px); background-size: 1px 24px; }
.next, .new-card { background-color: #dffcf0; background-image: linear-gradient(to bottom, rgba(0,0,0,0.08) 1px, transparent 1px); background-size: 1px 24px; }
.someday { background-color: #c8f7e2; background-image: linear-gradient(to bottom, rgba(0,0,0,0.08) 1px, transparent 1px); background-size: 1px 24px; }
.archive { background-color: #a0d9b7; background-image: linear-gradient(to bottom, rgba(0,0,0,0.08) 1px, transparent 1px); background-size: 1px 24px; }

#toggle-cards-btn {
  font-size: 0.75rem;
  margin-left: 8px;
  border: none;
  background: none;
  cursor: pointer;
  color: #333;
  padding: 0;
}

@import url('https://fonts.googleapis.com/css2?family=Patrick+Hand&display=swap');
.card h2 { font-family: 'Patrick Hand', cursive; font-size: 1.05rem; color: #666; display: flex; justify-content: space-between; align-items: center; }
.card h2 .first { font-weight: bold; color: #666; }
.card h2 .rest { opacity: 0.3; font-weight: normal; }
#today-date { font-size: 0.8rem; color: #888; margin-left: 6px; }

.task-list { flex: 1; overflow-y: auto; padding-right: 4px; scrollbar-width: thin; scrollbar-color: rgba(0,0,0,0.2) transparent; }
.task-list::-webkit-scrollbar { width: 6px; }
.task-list::-webkit-scrollbar-track { background: transparent; }
.task-list::-webkit-scrollbar-thumb { background-color: rgba(0,0,0,0.2); border-radius: 3px; }

.task { display: flex; flex-direction: column; padding: 6px 4px; margin-bottom: 2px; cursor: pointer; }
.task-top { display: flex; align-items: center; justify-content: space-between; }
.circle { width: 18px; height: 18px; border-radius: 50%; border: 2px solid #999; margin-right: 6px; flex-shrink: 0; display: inline-flex; align-items:center; justify-content:center; font-size:12px; font-weight:bold; transition: all 0.2s ease; background: #fff; color: #333; }
.task-text { flex: 1; word-break: break-word; font-size: 0.9rem; }
.task-toolbar { display: none; margin-left: 24px; margin-top: 2px; gap: 6px; }
.task-toolbar button { padding: 0; font-size: 0.7rem; border: none; background: none; opacity: 0.5; cursor: pointer; transition: opacity 0.15s ease; }
.task-toolbar button:hover { opacity: 0.8; }

.add-task { display: flex; gap: 4px; margin-top: 8px; z-index: 1; position: relative; flex-direction: column; }
.add-task-row { display:flex; gap: 4px; width:100%; }
.add-task input { flex: 1; padding: 6px 8px; border: 1px solid #ccc; border-radius: 6px; }
.add-task button { padding: 6px 12px; border: none; border-radius: 6px; background: #333; color: #fff; cursor: pointer; }
.add-task button:hover { background: #555; }

/* ================== SIGNIFIER TOOLBAR ================== */
.signifier-toolbar { display: flex; gap: 4px; margin-bottom: 4px; }
.signifier-toolbar button { padding: 2px 6px; border: 1px solid #ccc; border-radius: 6px; background:#f0f0f0; cursor: pointer; font-size: 1rem; }
.signifier-toolbar button.active { border-color: #333; background: #ddd; }

.switch { position: relative; display: inline-block; width: 40px; height: 20px; }
.switch input { opacity: 0; width: 0; height: 0; }
.slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #ccc; border-radius: 12px; transition: .2s; }
.slider:before { position: absolute; content: ""; height: 14px; width: 14px; left: 3px; bottom: 3px; background-color: white; border-radius: 50%; transition: .2s; }
input:checked + .slider { background-color: #4caf50; }
input:checked + .slider:before { transform: translateX(20px); }

.archive-tools { display: flex; gap: 8px; }
.archive-tools button { background: none; border: none; font-size: 12px; cursor: pointer; opacity: 0.6; padding: 0; }
.archive-tools button:hover { opacity: 1; }

.new-card-index { background:none; border:none; font-size:12px; opacity:0.6; cursor:pointer; margin-top:4px; display:block; text-align:center; }
.new-card-index:hover { opacity:1; }

.highlighted { background-color: #fff79a; color: #000; }
.red-highlighted { background-color: #FF746C; color: #000; }

.circle.completed { background: #34c759; border: none; color: white; }
.task-text.completed { opacity: 0.65; text-decoration: line-through; text-decoration-thickness: 1px; text-decoration-color: #c7c7cc; transition: all 0.25s ease; }

.card.someday { display: flex; flex-direction: column; }
.card.someday .task-list.scrollable { flex: 1; overflow-y: auto; padding-right: 4px; }
.someday-footer { display: flex; justify-content: flex-end; align-items: center; gap: 4px; font-size: 0.75rem; color: #999; margin-top: 8px; }
.someday-footer button { font-size: 0.75rem; border: none; background: none; cursor: pointer; color: #999; }

.card.today h2 { display: flex; align-items: center; justify-content: space-between; gap: 6px; }
.card.today h2 span:first-child { display: flex; align-items: center; gap: 4px; }
#today-date { font-size: 0.8rem; color: #888; margin-left: 4px; }

.task-notes { font-size: 0.8rem; color: #555; margin-left: 24px; margin-top: 2px; white-space: pre-wrap; }
.task-notes a { color: #007bff; cursor: pointer; text-decoration: underline; }

/* =========================
   MOBILE – FIXED SIZE CARDS
   ========================= */
@media (max-width: 600px) {
  #toggle-cards-btn { font-size: 0.65rem; }
  body { padding: 14px; gap: 18px; flex-direction: column; align-items: center; background: #f2f2f7; }
  .card { width: 100%; max-width: 420px; height: 480px; border-radius: 18px; display: flex; flex-direction: column; }
  .card h2 { flex-shrink: 0; }
  .task-list { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; scroll-behavior: smooth; }
  #today-summary, .add-task { flex-shrink: 0; }
  .task { padding: 10px 6px; }
  .circle { width: 22px; height: 22px; font-size: 14px; }
  .task-text { font-size: 1rem; }
  .task-toolbar button { font-size: 0.95rem; padding: 6px 4px; }
  .add-task input { padding: 10px 12px; font-size: 1rem; border-radius: 10px; }
  .add-task button { padding: 10px 14px; border-radius: 10px; font-size: 0.95rem; }
  .archive-tools { flex-wrap: wrap; gap: 8px; }
  #new-card h2 { flex-wrap: wrap; gap: 8px; }
  #new-card-title { width: 100%; }
  #help-overlay { width: 92vw; max-width: 92vw; border-radius: 16px; }
}
</style>
</head>
<body>

<!-- Today Card -->
<div class="card today">
  <h2>
    <span><span class="first">T</span><span class="rest">oday</span><span id="today-date"></span></span>
    <button id="toggle-cards-btn">focus mode</button>
    <button id="today-sort-btn" style="margin-left:8px; border:none; background:none; cursor:pointer; font-size:0.75rem; color:#333;">Sort A→Z</button>
    <button id="help-btn" title="Help" style="margin-left:8px; border:none; background:none; cursor:pointer; font-size:1.2rem; color:#333; display:flex; align-items:center; justify-content:center; transition:0.2s;">
      <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="currentColor" viewBox="0 0 16 16">
        <path d="M8 1a7 7 0 1 0 0 14A7 7 0 0 0 8 1zm0 12.933A5.933 5.933 0 1 1 8 2.067a5.933 5.933 0 0 1 0 11.866z"/>
        <path d="M5.255 5.786c.18-.72.738-1.2 1.745-1.2.694 0 1.113.324 1.113.84 0 .476-.302.736-.736 1.032-.464.314-.605.544-.605 1.152v.25h1v-.22c0-.36.105-.605.554-.93.566-.387.935-.69.935-1.444 0-.873-.672-1.497-1.762-1.497-1.064 0-1.713.552-1.926 1.296l.998.247zM8 11h-.002v1h.004v-1z"/>
      </svg>
    </button>
  </h2>
  
  <!-- SIGNIFIER TOOLBAR -->
  <div class="signifier-toolbar" id="today-signifiers">
    <button data-signifier="❗️">❗️</button>
    <button data-signifier="‼️">‼️</button>
    <button data-signifier="📆">📆</button>
    <button data-signifier="📝">📝</button>
    <button data-signifier="💡">💡</button>
  </div>
  
  <div class="add-task">
    <div class="add-task-row">
      <input type="text" placeholder="New task..." id="today-input">
      <button onclick="addTask('today')">Add</button>
    </div>
  </div>
  <div class="task-list" id="today-tasks"></div>
  <div id="today-summary" style="margin-top:6px; font-size:0.85rem; color:#555;"></div>
</div>

<!-- New Card (Signifier integrated) -->
<div class="card new-card" id="new-card">
  <h2>
    <input type="text" id="new-card-title" value="New Card" style="border:none;background:none;font-family:sans-serif;font-size:1.05rem; width: 140px;">
    <span class="archive-tools">
      <button onclick="toggleHideCard('new')">hide</button>
      <button onclick="prevNewCard()">Prev</button>
      <button onclick="nextNewCard()">Next</button>
      <button onclick="createNewCard()">New Card</button>
    </span>
  </h2>

  <!-- SIGNIFIER TOOLBAR -->
  <div class="signifier-toolbar" id="new-signifiers">
    <button data-signifier="❗️">❗️</button>
    <button data-signifier="‼️">‼️</button>
    <button data-signifier="📆">📆</button>
    <button data-signifier="📝">📝</button>
    <button data-signifier="💡">💡</button>
  </div>
  
  <div class="add-task">
    <div class="add-task-row">
      <input type="text" placeholder="New task..." id="new-card-input">
      <button onclick="addTask('new')">Add</button>
    </div>
  </div>
  <div class="task-list" id="new-card-tasks"></div>
  <button class="new-card-index" title="Current card index">Card 1/1</button>
</div>

<!-- (Rest of your other cards like Next, Someday, Archive, Help overlay stay exactly same) -->

<script>
// --- DATE ---
function todayDate(){ const d=new Date(); return d.toLocaleDateString(undefined,{day:'numeric',month:'short'}); }
document.getElementById('today-date').innerText=" "+todayDate();

// --- STORAGE ---
const storageKey='todayToolTasks';
let tasks=JSON.parse(localStorage.getItem(storageKey))||{today:[],next:[],someday:[],archive:[]};
function saveTasks(){ localStorage.setItem(storageKey,JSON.stringify(tasks)); }

const newCardsKey='newCards';
let newCards=JSON.parse(localStorage.getItem(newCardsKey))||[{title:'New Card',tasks:[]}];
let currentAdhoc=0;
function saveNewCards(){ localStorage.setItem(newCardsKey,JSON.stringify(newCards)); }

let hiddenCards={next:false,someday:false,archive:false,new:false};

// --- TODAY TEMP SORT STATE ---
let todaySortActive = false;

// --- SIGNIFIER STATE ---
let selectedSignifierToday = '';
let selectedSignifierNew = '';

// --- SIGNIFIER BUTTON LOGIC ---
function initSignifiers(){
  document.querySelectorAll('#today-signifiers button').forEach(btn=>{
    btn.onclick = function(){
      selectedSignifierToday = selectedSignifierToday===btn.dataset.signifier ? '' : btn.dataset.signifier;
      document.querySelectorAll('#today-signifiers button').forEach(b=>b.classList.remove('active'));
      if(selectedSignifierToday) btn.classList.add('active');
    }
  });
  document.querySelectorAll('#new-signifiers button').forEach(btn=>{
    btn.onclick = function(){
      selectedSignifierNew = selectedSignifierNew===btn.dataset.signifier ? '' : btn.dataset.signifier;
      document.querySelectorAll('#new-signifiers button').forEach(b=>b.classList.remove('active'));
      if(selectedSignifierNew) btn.classList.add('active');
    }
  });
}
initSignifiers();

// --- ADD TASK WITH SIGNIFIER ---
function addTask(card){ 
  let input,text,signifier='';
  if(card==='today'){ 
    input=document.getElementById('today-input'); 
    text=input.value.trim(); 
    if(!text) return; 
    signifier = selectedSignifierToday;
    tasks.today.push({text:signifier+text,status:'',highlighted:false,red:false}); 
    input.value=''; 
    selectedSignifierToday=''; 
    document.querySelectorAll('#today-signifiers button').forEach(b=>b.classList.remove('active'));
    saveTasks(); 
    renderTasks(); 
  }
  else if(card==='new'){ 
    input=document.getElementById('new-card-input'); 
    text=input.value.trim(); 
    if(!text) return; 
    signifier = selectedSignifierNew;
    newCards[currentAdhoc].tasks.push({text:signifier+text,status:'',highlighted:false,red:false}); 
    input.value=''; 
    selectedSignifierNew=''; 
    document.querySelectorAll('#new-signifiers button').forEach(b=>b.classList.remove('active'));
    saveNewCards(); 
    renderNewCardTasks(); 
  }
}

// --- RENDER TASKS ---
function renderTasks(){ 
  const list=document.getElementById('today-tasks'); 
  list.innerHTML=''; 
  tasks.today.forEach((t,i)=>{
    const div=document.createElement('div'); 
    div.className='task'; 
    const top=document.createElement('div'); top.className='task-top';
    const circle=document.createElement('div'); circle.className='circle'; 
    if(t.status==='completed'){circle.classList.add('completed');} 
    circle.onclick=()=>{t.status=t.status==='completed'?'':'completed';saveTasks();renderTasks();}
    const span=document.createElement('div'); span.className='task-text'; span.innerText=t.text; 
    if(t.status==='completed'){span.classList.add('completed');} 
    top.appendChild(circle); top.appendChild(span); div.appendChild(top);
    list.appendChild(div);
  });
}
function renderNewCardTasks(){ 
  const list=document.getElementById('new-card-tasks'); 
  list.innerHTML=''; 
  newCards[currentAdhoc].tasks.forEach((t,i)=>{
    const div=document.createElement('div'); div.className='task'; 
    const top=document.createElement('div'); top.className='task-top';
    const circle=document.createElement('div'); circle.className='circle'; 
    if(t.status==='completed'){circle.classList.add('completed');} 
    circle.onclick=()=>{t.status=t.status==='completed'?'':'completed';saveNewCards();renderNewCardTasks();}
    const span=document.createElement('div'); span.className='task-text'; span.innerText=t.text; 
    if(t.status==='completed'){span.classList.add('completed');} 
    top.appendChild(circle); top.appendChild(span); div.appendChild(top);
    list.appendChild(div);
  });
}

// --- INITIAL RENDER ---
renderTasks();
renderNewCardTasks();
</script>
</body>
</html>
