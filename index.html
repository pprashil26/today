<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Today Tool</title>

<style>
body {
    font-family: Arial, sans-serif;
    background: #f4f6f8;
    margin: 0;
    padding: 20px;
}

.container {
    display: flex;
    gap: 20px;
}

.card {
    background: white;
    padding: 15px;
    border-radius: 8px;
    width: 300px;
    display: flex;
    flex-direction: column;
}

.card h2 {
    font-size: 16px;
    font-weight: 500;
    color: #666;
    margin-bottom: 10px;
}

.task-list {
    list-style: none;
    padding: 0;
    margin: 0;
    height: 420px; /* fits ~10 tasks */
    overflow-y: auto;
}

.task-item {
    display: flex;
    flex-direction: column;
    padding: 6px 0;
}

.task-top-row {
    display: flex;
    align-items: center;
    gap: 6px;
}

.status-btn {
    cursor: pointer;
    width: 16px;
    text-align: center;
}

.task-text {
    flex: 1;
    word-break: break-word;
}

.task-controls {
    display: flex;
    gap: 8px;
    font-size: 12px;
    margin-top: 2px;
    margin-left: 22px;
}

.task-controls button {
    background: none;
    border: none;
    cursor: pointer;
    padding: 0;
    font-size: 12px;
}

input[type="text"] {
    padding: 6px;
    margin-top: 10px;
    font-size: 14px;
}

button.add-btn {
    margin-top: 5px;
    padding: 6px;
    font-size: 14px;
    cursor: pointer;
}

.toggle-container {
    margin-bottom: 15px;
}
</style>
</head>

<body>

<div class="toggle-container">
    <label>
        <input type="checkbox" id="focusToggle">
        Focus Mode (Today Only)
    </label>
</div>

<div class="container">

    <div class="card" id="todayCard">
        <h2>Today</h2>
        <ul class="task-list" id="todayList"></ul>
        <input type="text" id="todayInput" placeholder="Add task...">
        <button class="add-btn" onclick="addTask()">Add</button>
    </div>

    <div class="card" id="nextCard">
        <h2>Next</h2>
        <ul class="task-list" id="nextList"></ul>
    </div>

    <div class="card" id="completedCard">
        <h2>Completed</h2>
        <ul class="task-list" id="completedList"></ul>
    </div>

</div>

<script>
let tasks = JSON.parse(localStorage.getItem("tasks")) || {
    today: [],
    next: [],
    completed: []
};

function saveTasks() {
    localStorage.setItem("tasks", JSON.stringify(tasks));
}

function getStatusSymbol(status) {
    if (status === "completed") return "✓";
    if (status === "inprogress") return "→";
    return "•";
}

function cycleStatus(status) {
    if (status === "default") return "completed";
    if (status === "completed") return "inprogress";
    return "default";
}

function createMoveButton(label, targetCard) {
    const btn = document.createElement("button");
    btn.textContent = label;
    btn.onclick = function() {
        moveTask(this.closest("li"), targetCard);
    };
    return btn;
}

function createDeleteButton() {
    const btn = document.createElement("button");
    btn.textContent = "✕";
    btn.onclick = function() {
        const li = this.closest("li");
        const card = li.dataset.card;
        const index = Array.from(li.parentNode.children).indexOf(li);
        tasks[card].splice(index, 1);
        li.remove();
        saveTasks();
    };
    return btn;
}

function createTaskElement(taskObj, cardType) {
    const li = document.createElement("li");
    li.className = "task-item";
    li.dataset.card = cardType;

    const taskTopRow = document.createElement("div");
    taskTopRow.className = "task-top-row";

    const statusBtn = document.createElement("span");
    statusBtn.className = "status-btn";
    statusBtn.textContent = getStatusSymbol(taskObj.status);

    const taskSpan = document.createElement("span");
    taskSpan.className = "task-text";
    taskSpan.textContent = taskObj.text;

    taskTopRow.appendChild(statusBtn);
    taskTopRow.appendChild(taskSpan);

    const taskControls = document.createElement("div");
    taskControls.className = "task-controls";

    if (cardType !== "today")
        taskControls.appendChild(createMoveButton("T", "today"));
    if (cardType !== "next")
        taskControls.appendChild(createMoveButton("N", "next"));
    if (cardType !== "completed")
        taskControls.appendChild(createMoveButton("C", "completed"));

    taskControls.appendChild(createDeleteButton());

    li.appendChild(taskTopRow);
    li.appendChild(taskControls);

    statusBtn.onclick = function() {
        taskObj.status = cycleStatus(taskObj.status);
        statusBtn.textContent = getStatusSymbol(taskObj.status);
        saveTasks();
    };

    return li;
}

function renderTasks() {
    document.getElementById("todayList").innerHTML = "";
    document.getElementById("nextList").innerHTML = "";
    document.getElementById("completedList").innerHTML = "";

    for (let card in tasks) {
        tasks[card].forEach(task => {
            const li = createTaskElement(task, card);
            document.getElementById(card + "List").appendChild(li);
        });
    }
}

function addTask() {
    const input = document.getElementById("todayInput");
    const text = input.value.trim();
    if (!text) return;

    const taskObj = { text: text, status: "default" };
    tasks.today.push(taskObj);
    saveTasks();
    renderTasks();
    input.value = "";
}

function moveTask(li, targetCard) {
    const currentCard = li.dataset.card;
    const index = Array.from(li.parentNode.children).indexOf(li);
    const taskObj = tasks[currentCard][index];

    tasks[currentCard].splice(index, 1);
    tasks[targetCard].push(taskObj);

    saveTasks();
    renderTasks();
}

document.getElementById("todayInput").addEventListener("keypress", function(e) {
    if (e.key === "Enter") addTask();
});

document.getElementById("focusToggle").addEventListener("change", function() {
    const show = !this.checked;
    document.getElementById("nextCard").style.display = show ? "flex" : "none";
    document.getElementById("completedCard").style.display = show ? "flex" : "none";
});

renderTasks();
</script>

</body>
</html>
