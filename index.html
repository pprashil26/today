<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Today Tool - v1.6.1</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:sans-serif}
body{background:#f4f4f4;padding:20px;display:flex;justify-content:center;flex-wrap:wrap;gap:20px}

.card{width:300px;height:420px;border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:8px;position:relative;box-shadow:0 6px 18px rgba(0,0,0,.12);overflow:hidden}
.today{background:#fff}
.next,.new-card{background:#dffcf0}
.someday{background:#c8f7e2}
.archive{background:#a0d9b7}

.card h2{font-size:1.05rem;color:#666;display:flex;justify-content:space-between;align-items:center}
.task-list{flex:1;overflow-y:auto;padding-right:4px}
.task{display:flex;flex-direction:column;padding:6px 4px;margin-bottom:2px;cursor:pointer}
.task-top{display:flex;align-items:center;justify-content:space-between}
.circle{width:18px;height:18px;border-radius:50%;border:2px solid #999;margin-right:6px;display:inline-flex;align-items:center;justify-content:center;font-size:12px;font-weight:bold;background:#fff;cursor:pointer}
.task-text{flex:1;font-size:.9rem;word-break:break-word}
.task-toolbar{display:none;margin-left:24px;margin-top:2px;gap:6px;flex-wrap:wrap}
.task-toolbar button{padding:0;font-size:.7rem;border:none;background:none;opacity:.5;cursor:pointer}
.task-toolbar button:hover{opacity:.9}
.add-task{display:flex;gap:4px;margin-top:8px}
.add-task input{flex:1;padding:6px;border:1px solid #ccc;border-radius:6px}
.add-task button{padding:6px 12px;border:none;border-radius:6px;background:#333;color:#fff;cursor:pointer}
.add-task button:hover{background:#555}
.archive-tools{display:flex;gap:8px}
.archive-tools button{background:none;border:none;font-size:12px;cursor:pointer;opacity:.6}
.archive-tools button:hover{opacity:1}
.highlighted{background:#fff79a}
.switch{position:relative;display:inline-block;width:40px;height:20px}
.switch input{opacity:0;width:0;height:0}
.slider{position:absolute;cursor:pointer;top:0;left:0;right:0;bottom:0;background:#ccc;border-radius:12px}
.slider:before{position:absolute;content:"";height:14px;width:14px;left:3px;bottom:3px;background:#fff;border-radius:50%;transition:.2s}
input:checked+.slider{background:#4caf50}
input:checked+.slider:before{transform:translateX(20px)}
</style>
</head>
<body>

<!-- TODAY -->
<div class="card today">
<h2>
<span>TODAY</span>
<label class="switch">
<input type="checkbox" id="toggle-cards" checked>
<span class="slider"></span>
</label>
<button id="help-btn" style="border:none;background:none;cursor:pointer;font-size:.9rem">How To</button>
</h2>
<div class="task-list" id="today-tasks"></div>
<div class="add-task">
<input type="text" id="today-input" placeholder="New task...">
<button onclick="addTask('today')">Add</button>
</div>
</div>

<!-- NEXT -->
<div class="card next" id="next-card">
<h2>
<span>NEXT</span>
<span class="archive-tools"><button onclick="toggleHideCard('next')">hide</button></span>
</h2>
<div class="task-list" id="next-tasks"></div>
</div>

<!-- SOMEDAY -->
<div class="card someday" id="someday-card">
<h2>
<span>SOMEDAY</span>
<span class="archive-tools"><button onclick="toggleHideCard('someday')">hide</button></span>
</h2>
<div class="task-list" id="someday-tasks"></div>
</div>

<!-- ARCHIVE -->
<div class="card archive" id="archive-card">
<h2>
<span>ARCHIVE</span>
<span class="archive-tools">
<button onclick="exportTasksTxt()">Export (Backup)</button>
<button onclick="exportReadableTxt()">Export (Readable)</button>
<button onclick="importTasksTxt()">Import</button>
<button onclick="toggleHideCard('archive')">hide</button>
</span>
</h2>
<div class="task-list" id="archive-tasks"></div>
</div>

<!-- NEW CARD -->
<div class="card new-card" id="new-card">
<h2>
<input id="new-card-title" value="New Card" style="border:none;background:none;font-size:1rem;width:150px">
<span class="archive-tools">
<button onclick="toggleHideCard('new')">hide</button>
<button onclick="prevNewCard()">Prev</button>
<button onclick="nextNewCard()">Next</button>
<button onclick="createNewCard()">New Card</button>
</span>
</h2>
<div class="task-list" id="new-card-tasks"></div>
<div class="add-task">
<input type="text" id="new-card-input" placeholder="New task...">
<button onclick="addTask('new')">Add</button>
</div>
</div>

<!-- HELP -->
<div id="help-overlay" style="display:none;position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);
background:#fff;border:1px solid #ccc;padding:16px;border-radius:8px;box-shadow:0 4px 12px rgba(0,0,0,.2)">
<strong>Quick Guide</strong>
<ul style="margin-top:8px;padding-left:18px;font-size:.9rem">
<li>Add task → Type + Add</li>
<li>Move task → T / N / S / ✕</li>
<li>Toggle status → Click circle</li>
<li>Highlight → ⭐</li>
<li>New Cards → Manage multiple projects</li>
</ul>
<button id="close-help" style="margin-top:8px">Close</button>
</div>

<script>
const storageKey='todayToolTasks'
const newCardsKey='newCards'
let tasks=JSON.parse(localStorage.getItem(storageKey))||{today:[],next:[],someday:[],archive:[]}
let newCards=JSON.parse(localStorage.getItem(newCardsKey))||[{title:'New Card',tasks:[]}]
let currentAdhoc=0
let hiddenCards={next:false,someday:false,archive:false,new:false}

function saveTasks(){localStorage.setItem(storageKey,JSON.stringify(tasks))}
function saveNewCards(){localStorage.setItem(newCardsKey,JSON.stringify(newCards))}

const toggleCards=document.getElementById('toggle-cards')
const helpBtn=document.getElementById('help-btn')
const helpOverlay=document.getElementById('help-overlay')
const closeHelp=document.getElementById('close-help')

// ADD TASK
function addTask(card){
  let input,text
  if(card==='today'){input=document.getElementById('today-input');text=input.value.trim();if(!text)return;tasks.today.push({text,status:'',highlighted:false});input.value='';saveTasks()}
  if(card==='new'){input=document.getElementById('new-card-input');text=input.value.trim();if(!text)return;newCards[currentAdhoc].tasks.push({text,status:'',highlighted:false});input.value='';saveNewCards()}
  renderTasks()
}

// TASK ACTIONS
function moveTask(from,to,i){const t=tasks[from].splice(i,1)[0];tasks[to].push(t);saveTasks();renderTasks()}
function deleteTask(card,i){tasks[card].splice(i,1);saveTasks();renderTasks()}
function toggleStatus(card,i){const s=['','inprogress','completed'];const c=tasks[card][i].status;tasks[card][i].status=s[(s.indexOf(c)+1)%3];saveTasks();renderTasks()}
function toggleHighlight(card,i){tasks[card][i].highlighted=!tasks[card][i].highlighted;saveTasks();renderTasks()}
function toggleStatusNew(i){const s=['','inprogress','completed'];const c=newCards[currentAdhoc].tasks[i].status;newCards[currentAdhoc].tasks[i].status=s[(s.indexOf(c)+1)%3];saveNewCards();renderTasks()}
function moveTaskNewToExisting(target,i){const t=newCards[currentAdhoc].tasks.splice(i,1)[0];tasks[target].push(t);saveTasks();saveNewCards();renderTasks()}

// NEW CARD CONTROLS
function createNewCard(){newCards.push({title:'New Card',tasks:[]});currentAdhoc=newCards.length-1;saveNewCards();renderTasks()}
function prevNewCard(){if(currentAdhoc>0){currentAdhoc--;renderTasks()}}
function nextNewCard(){if(currentAdhoc<newCards.length-1){currentAdhoc++;renderTasks()}}

// HIDE CARDS
function toggleHideCard(card){hiddenCards[card]=!hiddenCards[card];renderTasks()}
toggleCards.addEventListener('change',()=>{renderTasks()})

// RENDER
function renderTasks(){
  ['today','next','someday','archive'].forEach(card=>{
    const c=document.getElementById(card+'-card')
    const container=document.getElementById(card+'-tasks')
    container.innerHTML=''
    if(card!=='today')c.style.display=(hiddenCards[card]||!toggleCards.checked)?'none':'flex'

    tasks[card].forEach((t,i)=>{
      const div=document.createElement('div'); div.className='task'; if(t.highlighted)div.classList.add('highlighted')
      const topRow=document.createElement('div'); topRow.className='task-top'
      const left=document.createElement('div'); left.style.display='flex'; left.style.alignItems='center'
      const circle=document.createElement('span'); circle.className='circle'; circle.textContent=t.status==='completed'?'✓':t.status==='inprogress'?'→':'•'; circle.title=t.status||'No status'; circle.onclick=(e)=>{e.stopPropagation(); toggleStatus(card,i)}
      const text=document.createElement('span'); text.className='task-text'; text.textContent=t.text
      left.append(circle,text)
      topRow.append(left)
      const tb=document.createElement('div'); tb.className='task-toolbar'

      if(card!=='archive'){
        const todayBtn=document.createElement('button'); todayBtn.textContent='T'; todayBtn.onclick=(e)=>{e.stopPropagation(); moveTask(card,'today',i)}
        const nextBtn=document.createElement('button'); nextBtn.textContent='N'; nextBtn.onclick=(e)=>{e.stopPropagation(); moveTask(card,'next',i)}
        const somedayBtn=document.createElement('button'); somedayBtn.textContent='S'; somedayBtn.onclick=(e)=>{e.stopPropagation(); moveTask(card,'someday',i)}
        const archiveBtn=document.createElement('button'); archiveBtn.textContent='✕'; archiveBtn.onclick=(e)=>{e.stopPropagation(); moveTask(card,'archive',i)}
        const highlightBtn=document.createElement('button'); highlightBtn.textContent='⭐'; highlightBtn.style.opacity=t.highlighted?'1':'0.3'; highlightBtn.onclick=(e)=>{e.stopPropagation(); toggleHighlight(card,i)}
        tb.append(todayBtn,nextBtn,somedayBtn,archiveBtn,highlightBtn)
      } else {
        const todayBtn=document.createElement('button'); todayBtn.textContent='T'; todayBtn.onclick=(e)=>{e.stopPropagation(); moveTask('archive','today',i)}
        const nextBtn=document.createElement('button'); nextBtn.textContent='N'; nextBtn.onclick=(e)=>{e.stopPropagation(); moveTask('archive','next',i)}
        const somedayBtn=document.createElement('button'); somedayBtn.textContent='S'; somedayBtn.onclick=(e)=>{e.stopPropagation(); moveTask('archive','someday',i)}
        const highlightBtn=document.createElement('button'); highlightBtn.textContent='⭐'; highlightBtn.style.opacity=t.highlighted?'1':'0.3'; highlightBtn.onclick=(e)=>{e.stopPropagation(); toggleHighlight('archive',i)}
        const delBtn=document.createElement('button'); delBtn.textContent='Delete'; delBtn.onclick=(e)=>{e.stopPropagation(); deleteTask('archive',i)}
        tb.append(todayBtn,nextBtn,somedayBtn,highlightBtn,delBtn)
      }

      const chevron=document.createElement('span'); chevron.className='chevron'; chevron.textContent='>'; chevron.onclick=(e)=>{e.stopPropagation(); tb.style.display=(tb.style.display==='flex')?'none':'flex'; chevron.style.transform=(tb.style.display==='flex')?'rotate(90deg)':'rotate(0deg)'}
      div.onclick=()=>{ const open=tb.style.display==='flex'; tb.style.display=open?'none':'flex'; chevron.style.transform=open?'rotate(0deg)':'rotate(90deg)'}
      topRow.append(chevron)
      div.append(topRow,tb)
      container.appendChild(div)
    })
  })

  // NEW CARD
  const nc=document.getElementById('new-card'); const nContainer=document.getElementById('new-card-tasks'); nContainer.innerHTML=''
  const current=newCards[currentAdhoc]; nc.style.display=(hiddenCards.new||!toggleCards.checked)?'none':'flex'
  document.getElementById('new-card-title').value=current.title
  current.tasks.forEach((t,i)=>{
    const div=document.createElement('div'); div.className='task'; if(t.highlighted)div.classList.add('highlighted')
    const topRow=document.createElement('div'); topRow.className='task-top'
    const left=document.createElement('div'); left.style.display='flex'; left.style.alignItems='center'
    const circle=document.createElement('span'); circle.className='circle'; circle.textContent=t.status==='completed'?'✓':t.status==='inprogress'?'→':'•'; circle.title=t.status||'No status'; circle.onclick=(e)=>{e.stopPropagation(); toggleStatusNew(i)}
    const text=document.createElement('span'); text.className='task-text'; text.textContent=t.text
    left.append(circle,text)
    topRow.append(left)
    const tb=document.createElement('div'); tb.className='task-toolbar'
    const todayBtn=document.createElement('button'); todayBtn.textContent='T'; todayBtn.onclick=(e)=>{e.stopPropagation(); moveTaskNewToExisting('today',i)}
    const nextBtn=document.createElement('button'); nextBtn.textContent='N'; nextBtn.onclick=(e)=>{e.stopPropagation(); moveTaskNewToExisting('next',i)}
    const somedayBtn=document.createElement('button'); somedayBtn.textContent='S'; somedayBtn.onclick=(e)=>{e.stopPropagation(); moveTaskNewToExisting('someday',i)}
    const archiveBtn=document.createElement('button'); archiveBtn.textContent='✕'; archiveBtn.onclick=(e)=>{e.stopPropagation(); moveTaskNewToExisting('archive',i)}
    const highlightBtn=document.createElement('button'); highlightBtn.textContent='⭐'; highlightBtn.style.opacity=t.highlighted?'1':'0.3'; highlightBtn.onclick=(e)=>{e.stopPropagation(); toggleHighlightNew(i)}
    tb.append(todayBtn,nextBtn,somedayBtn,archiveBtn,highlightBtn)
    const chevron=document.createElement('span'); chevron.className='chevron'; chevron.textContent='>'; chevron.onclick=(e)=>{e.stopPropagation(); tb.style.display=(tb.style.display==='flex')?'none':'flex'; chevron.style.transform=(tb.style.display==='flex')?'rotate(90deg)':'rotate(0deg)'}
    div.onclick=()=>{ const open=tb.style.display==='flex'; tb.style.display=open?'none':'flex'; chevron.style.transform=open?'rotate(0deg)':'rotate(90deg)'}
    topRow.append(chevron)
    div.append(topRow,tb)
    nContainer.appendChild(div)
  })
}

// EXPORT / IMPORT
function exportTasksTxt(){const data={tasks,newCards};const blob=new Blob([JSON.stringify(data,null,2)],{type:'text/plain'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='today-tool-backup.txt';a.click()}
function exportReadableTxt(){let lines=[];lines.push("# TODAY TOOL EXPORT v1\n");function writeSection(name,arr){lines.push(name);arr.forEach(t=>{let s=" ";if(t.status==="inprogress")s="→";if(t.status==="completed")s="✓";if(t.highlighted)s="*";lines.push(`- [${s}] ${t.text}`)});lines.push("")}writeSection("TODAY",tasks.today);writeSection("NEXT",tasks.next);writeSection("SOMEDAY",tasks.someday);writeSection("ARCHIVE",tasks.archive);newCards.forEach(card=>{lines.push(`NEW CARD: ${card.title}`);card.tasks.forEach(t=>{let s=" ";if(t.status==="inprogress")s="→";if(t.status==="completed")s="✓";if(t.highlighted)s="*";lines.push(`- [${s}] ${t.text}`)});lines.push("")});const blob=new Blob([lines.join("\n")],{type:'text/plain'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='today-tool-readable.txt';a.click()}

function importTasksTxt(){const input=document.createElement('input');input.type='file';input.accept='.txt';input.onchange=e=>{const reader=new FileReader();reader.onload=evt=>{const content=evt.target.result.trim();try{const data=JSON.parse(content);if(data.tasks)tasks=data.tasks;if(data.newCards)newCards=data.newCards;saveTasks();saveNewCards();renderTasks();return}catch{}parseReadableFormat(content)};reader.readAsText(e.target.files[0])};input.click()}

function parseReadableFormat(content){tasks={today:[],next:[],someday:[],archive:[]};newCards=[];let section=null;let currentNew=null;content.split("\n").forEach(line=>{line=line.trim();if(!line||line.startsWith("#"))return;if(line==="TODAY"){section="today";return}if(line==="NEXT"){section="next";return}if(line==="SOMEDAY"){section="someday";return}if(line==="ARCHIVE"){section="archive";return}if(line.startsWith("NEW CARD:")){currentNew={title:line.replace("NEW CARD:","").trim(),tasks:[]};newCards.push(currentNew);section=null;return}if(line.startsWith("- [")){const status=line[3];const text=line.substring(6).trim();const task={text,status:"",highlighted:false};if(status==="→")task.status="inprogress";if(status==="✓")task.status="completed";if(status==="*")task.highlighted=true;if(section)tasks[section].push(task);else if(currentNew)currentNew.tasks.push(task)}});if(newCards.length===0)newCards=[{title:"New Card",tasks:[]}];saveTasks();saveNewCards();renderTasks()}

function toggleHighlightNew(i){newCards[currentAdhoc].tasks[i].highlighted=!newCards[currentAdhoc].tasks[i].highlighted;saveNewCards();renderTasks()}

// HELP
helpBtn.onclick=()=>helpOverlay.style.display='block'
closeHelp.onclick=()=>helpOverlay.style.display='none'

renderTasks()
</script>
</body>
</html>
