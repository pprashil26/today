<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Today Tool - v1.4.3</title>

<style>
* { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
body { background: #f4f4f4; padding: 20px; display: flex; justify-content: center; flex-wrap: wrap; gap: 20px; }

.card { 
  width: 300px; 
  height: 420px; /* uniform height (~10 tasks visible) */
  border-radius: 12px; 
  padding: 16px; 
  display: flex; 
  flex-direction: column; 
  gap: 8px; 
  position: relative; 
  box-shadow: 0 6px 18px rgba(0,0,0,0.12); 
  overflow: hidden; 
}

.card::before { 
  content: ""; 
  position: absolute; 
  inset: 0; 
  background: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100"><rect width="100" height="100" fill="none" stroke="%23e0e0e0" stroke-width="1"/></svg>') repeat; 
  opacity: 0.03; 
  pointer-events: none; 
}

.today { background-color: #ffffff; background-image: linear-gradient(to bottom, rgba(0,0,0,0.08) 1px, transparent 1px); background-size: 1px 24px; }
.next, .new-card { background-color: #dffcf0; background-image: linear-gradient(to bottom, rgba(0,0,0,0.08) 1px, transparent 1px); background-size: 1px 24px; }
.someday { background-color: #c8f7e2; background-image: linear-gradient(to bottom, rgba(0,0,0,0.08) 1px, transparent 1px); background-size: 1px 24px; }
.archive { background-color: #a0d9b7; background-image: linear-gradient(to bottom, rgba(0,0,0,0.08) 1px, transparent 1px); background-size: 1px 24px; }

@import url('https://fonts.googleapis.com/css2?family=Patrick+Hand&display=swap');
.card h2 { font-family: 'Patrick Hand', cursive; font-size: 1.05rem; color: #666; display: flex; justify-content: space-between; align-items: center; }

.card h2 .first { font-weight: bold; color: #666; }
.card h2 .rest { opacity: 0.3; font-weight: normal; }

#today-date { font-size: 0.8rem; color: #888; margin-left: 6px; }

.task-list { flex: 1; overflow-y: auto; }

.task { display: flex; flex-direction: column; padding: 6px 4px; margin-bottom: 2px; cursor: pointer; }
.task-top { display: flex; align-items: center; justify-content: space-between; }

.circle { 
  width: 18px; 
  height: 18px; 
  border-radius: 50%; 
  border: 2px solid #999; 
  margin-right: 6px; 
  flex-shrink: 0; 
  display: inline-flex; 
  align-items:center; 
  justify-content:center; 
  font-size:12px; 
  font-weight:bold; 
  background: #fff; 
  color: #333; 
}

.task-text { flex: 1; word-break: break-word; font-size: 0.9rem; }

.task-toolbar { display: none; margin-left: 24px; margin-top: 2px; gap: 6px; }
.task-toolbar button { padding: 0; font-size: 0.7rem; border: none; background: none; opacity: 0.5; cursor: pointer; }
.task-toolbar button:hover { opacity: 0.8; }

.chevron { font-size: 12px; margin-left: 6px; transition: transform 0.2s ease; }

.add-task { display: flex; gap: 4px; margin-top: 8px; }
.add-task input { flex: 1; padding: 6px 8px; border: 1px solid #ccc; border-radius: 6px; }
.add-task button { padding: 6px 12px; border: none; border-radius: 6px; background: #333; color: #fff; cursor: pointer; }
.add-task button:hover { background: #555; }

.switch { position: relative; display: inline-block; width: 40px; height: 20px; }
.switch input { opacity: 0; width: 0; height: 0; }
.slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #ccc; border-radius: 12px; transition: .2s; }
.slider:before { position: absolute; content: ""; height: 14px; width: 14px; left: 3px; bottom: 3px; background-color: white; border-radius: 50%; transition: .2s; }
input:checked + .slider { background-color: #4caf50; }
input:checked + .slider:before { transform: translateX(20px); }

.archive-tools { display: flex; gap: 8px; }
.archive-tools button { background: none; border: none; font-size: 12px; cursor: pointer; opacity: 0.6; padding: 0; }
.archive-tools button:hover { opacity: 1; }

.highlighted { background-color: #fff79a; color: #000; }
</style>
</head>
<body>

<!-- TODAY -->
<div class="card today">
  <h2>
    <span><span class="first">T</span><span class="rest">oday</span><span id="today-date"></span></span>
    <label class="switch">
      <input type="checkbox" id="toggle-cards" checked>
      <span class="slider"></span>
    </label>
  </h2>
  <div class="task-list" id="today-tasks"></div>
  <div class="add-task">
    <input type="text" placeholder="New task..." id="today-input">
    <button onclick="addTask('today')">Add</button>
  </div>
</div>

<!-- NEXT -->
<div class="card next" id="next-card">
  <h2><span><span class="first">N</span><span class="rest">ext</span></span>
    <span class="archive-tools"><button onclick="toggleHideCard('next')">hide</button></span>
  </h2>
  <div class="task-list" id="next-tasks"></div>
</div>

<!-- SOMEDAY -->
<div class="card someday" id="someday-card">
  <h2><span><span class="first">S</span><span class="rest">omeday</span></span>
    <span class="archive-tools"><button onclick="toggleHideCard('someday')">hide</button></span>
  </h2>
  <div class="task-list" id="someday-tasks"></div>
</div>

<!-- ARCHIVE -->
<div class="card archive" id="archive-card">
  <h2>
    Archive
    <span class="archive-tools">
      <button onclick="exportTasksTxt()">Export</button>
      <button onclick="importTasksTxt()">Import</button>
      <button onclick="toggleHideCard('archive')">hide</button>
    </span>
  </h2>
  <div class="task-list" id="archive-tasks"></div>
</div>

<!-- NEW CARD -->
<div class="card new-card" id="new-card">
  <h2>
    <input type="text" id="new-card-title" value="New Card" 
      style="border:none;background:none;font-family:'Patrick Hand',cursive;font-size:1rem; width:150px;">
    <span class="archive-tools">
      <button onclick="toggleHideCard('new')">hide</button>
      <button onclick="prevNewCard()">Prev</button>
      <button onclick="nextNewCard()">Next</button>
      <button onclick="createNewCard()">New Card</button>
    </span>
  </h2>
  <div class="task-list" id="new-card-tasks"></div>
  <div class="add-task">
    <input type="text" placeholder="New task..." id="new-card-input">
    <button onclick="addTask('new')">Add</button>
  </div>
</div>

<script>
function todayDate() { const d=new Date(); return d.toLocaleDateString(undefined,{day:'numeric',month:'short'}); }
document.getElementById('today-date').innerText=" "+todayDate();

const storageKey='todayToolTasks';
let tasks=JSON.parse(localStorage.getItem(storageKey))||{today:[],next:[],someday:[],archive:[]};
function saveTasks(){ localStorage.setItem(storageKey,JSON.stringify(tasks)); }

const newCardsKey='newCards';
let newCards=JSON.parse(localStorage.getItem(newCardsKey))||[{title:'New Card',tasks:[]}];
let currentAdhoc=0;
function saveNewCards(){ localStorage.setItem(newCardsKey,JSON.stringify(newCards)); }

let hiddenCards = {next:false,someday:false,archive:false,new:false};

document.getElementById('toggle-cards').addEventListener('change',renderTasks);

function toggleHideCard(card){
  hiddenCards[card]=!hiddenCards[card];
  renderTasks();
}

function renderTasks(){

  const masterOn=document.getElementById('toggle-cards').checked;

  ['next','someday','archive','new'].forEach(card=>{
    const el=document.getElementById(card+'-card')||document.getElementById('new-card');
    if(!masterOn){
      el.style.display='none';
    } else {
      el.style.display=hiddenCards[card]?'none':'flex';
    }
  });

  ['today','next','someday','archive'].forEach(card=>{
    const container=document.getElementById(card+'-tasks');
    if(!container) return;
    container.innerHTML='';
    tasks[card].forEach((task,idx)=>{
      const div=document.createElement('div');
      div.className='task';
      if(task.highlighted) div.classList.add('highlighted');
      div.innerHTML=`<div class="task-top">
        <div style="display:flex;align-items:center;">
        <span class="circle">${task.status==='completed'?'✓':task.status==='inprogress'?'→':'•'}</span>
        <span class="task-text">${task.text}</span></div></div>`;
      div.querySelector('.circle').onclick=()=>toggleStatus(card,idx);
      container.appendChild(div);
    });
  });

  const newCardContainer=document.getElementById('new-card-tasks');
  newCardContainer.innerHTML='';
  const current=newCards[currentAdhoc];
  document.getElementById('new-card-title').value=current.title;
  current.tasks.forEach((task,idx)=>{
    const div=document.createElement('div');
    div.className='task';
    if(task.highlighted) div.classList.add('highlighted');
    div.innerHTML=`<div class="task-top">
      <div style="display:flex;align-items:center;">
      <span class="circle">${task.status==='completed'?'✓':task.status==='inprogress'?'→':'•'}</span>
      <span class="task-text">${task.text}</span></div></div>`;
    div.querySelector('.circle').onclick=()=>toggleStatusNew(idx);
    newCardContainer.appendChild(div);
  });
}

document.getElementById('new-card-title').addEventListener('input',function(){
  newCards[currentAdhoc].title=this.value;
  saveNewCards();
});

function addTask(card){
  if(card==='today'){
    const input=document.getElementById('today-input');
    const text=input.value.trim();
    if(!text) return;
    tasks.today.push({text,status:'',highlighted:false});
    input.value=''; saveTasks(); renderTasks();
  } else {
    const input=document.getElementById('new-card-input');
    const text=input.value.trim();
    if(!text) return;
    newCards[currentAdhoc].tasks.push({text,status:'',highlighted:false});
    input.value=''; saveNewCards(); renderTasks();
  }
}

function toggleStatus(card,idx){
  const order=['','completed','inprogress'];
  let cur=tasks[card][idx].status;
  tasks[card][idx].status=order[(order.indexOf(cur)+1)%order.length];
  saveTasks(); renderTasks();
}

function toggleStatusNew(idx){
  const order=['','completed','inprogress'];
  let cur=newCards[currentAdhoc].tasks[idx].status;
  newCards[currentAdhoc].tasks[idx].status=order[(order.indexOf(cur)+1)%order.length];
  saveNewCards(); renderTasks();
}

function prevNewCard(){ currentAdhoc=(currentAdhoc-1+newCards.length)%newCards.length; renderTasks(); }
function nextNewCard(){ currentAdhoc=(currentAdhoc+1)%newCards.length; renderTasks(); }
function createNewCard(){ newCards.push({title:'New Card',tasks:[]}); currentAdhoc=newCards.length-1; saveNewCards(); renderTasks(); }

function exportTasksTxt(){ const blob=new Blob([JSON.stringify(tasks)],{type:'text/plain'}); const url=URL.createObjectURL(blob); const a=document.createElement('a'); a.href=url; a.download='tasks.txt'; a.click(); URL.revokeObjectURL(url); }
function importTasksTxt(){ const inp=document.createElement('input'); inp.type='file'; inp.accept='text/plain'; inp.onchange=e=>{ const reader=new FileReader(); reader.onload=()=>{ try{ tasks=JSON.parse(reader.result); saveTasks(); renderTasks(); }catch{alert('Invalid file');} }; reader.readAsText(e.target.files[0]); }; inp.click(); }

renderTasks();
</script>
</body>
</html>
