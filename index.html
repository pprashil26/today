<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Today Tool - v1.5.4</title>

<style>
* { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }

body { 
  background: #f4f4f4; 
  padding: 20px; 
  display: flex; 
  justify-content: center; 
  flex-wrap: wrap; 
  gap: 20px; 
}

.card { 
  width: 300px; 
  height: 420px; 
  border-radius: 12px; 
  padding: 16px; 
  display: flex; 
  flex-direction: column; 
  gap: 8px; 
  position: relative; 
  box-shadow: 0 6px 18px rgba(0,0,0,0.12); 
  overflow: hidden; 
}

.card::before { 
  content: ""; 
  position: absolute; 
  inset: 0; 
  background: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100"><rect width="100" height="100" fill="none" stroke="%23e0e0e0" stroke-width="1"/></svg>') repeat; 
  opacity: 0.03; 
  pointer-events: none; 
}

.today { background-color: #ffffff; background-image: linear-gradient(to bottom, rgba(0,0,0,0.08) 1px, transparent 1px); background-size: 1px 24px; }
.next, .new-card { background-color: #dffcf0; background-image: linear-gradient(to bottom, rgba(0,0,0,0.08) 1px, transparent 1px); background-size: 1px 24px; }
.someday { background-color: #c8f7e2; background-image: linear-gradient(to bottom, rgba(0,0,0,0.08) 1px, transparent 1px); background-size: 1px 24px; }
.archive { background-color: #a0d9b7; background-image: linear-gradient(to bottom, rgba(0,0,0,0.08) 1px, transparent 1px); background-size: 1px 24px; }

/* Title styling — now fully sans-serif */
.card h2 { 
  font-size: 1.05rem; 
  color: #666; 
  display: flex; 
  justify-content: space-between; 
  align-items: center; 
}

.card h2 .first { font-weight: bold; }
.card h2 .rest { opacity: 0.3; }

#today-date { 
  font-size: 0.8rem; 
  color: #888; 
  margin-left: 6px; 
}

.task-list { 
  flex: 1; 
  overflow-y: auto; 
  padding-right: 4px; 
  scrollbar-width: thin; 
  scrollbar-color: rgba(0,0,0,0.2) transparent; 
}

.task-list::-webkit-scrollbar { width: 6px; }
.task-list::-webkit-scrollbar-track { background: transparent; }
.task-list::-webkit-scrollbar-thumb { 
  background-color: rgba(0,0,0,0.2); 
  border-radius: 3px; 
}

.task { 
  display: flex; 
  flex-direction: column; 
  padding: 6px 4px; 
  margin-bottom: 2px; 
  cursor: pointer; 
}

.task-top { 
  display: flex; 
  align-items: center; 
  justify-content: space-between; 
}

.circle { 
  width: 18px; 
  height: 18px; 
  border-radius: 50%; 
  border: 2px solid #999; 
  margin-right: 6px; 
  flex-shrink: 0; 
  display: inline-flex; 
  align-items:center; 
  justify-content:center; 
  font-size:12px; 
  font-weight:bold; 
  transition: all 0.2s ease; 
  background: #fff; 
  color: #333; 
}

.task-text { 
  flex: 1; 
  word-break: break-word; 
  font-size: 0.9rem; 
}

.task-toolbar { 
  display: none; 
  margin-left: 24px; 
  margin-top: 2px; 
  gap: 6px; 
}

.task-toolbar button { 
  padding: 0; 
  font-size: 0.7rem; 
  border: none; 
  background: none; 
  opacity: 0.5; 
  cursor: pointer; 
  transition: opacity 0.15s ease; 
}

.task-toolbar button:hover { opacity: 0.8; }

.chevron { 
  font-size: 12px; 
  margin-left: 6px; 
  transition: transform 0.2s ease; 
}

.add-task { 
  display: flex; 
  gap: 4px; 
  margin-top: 8px; 
  z-index: 1; 
  position: relative; 
}

.add-task input { 
  flex: 1; 
  padding: 6px 8px; 
  border: 1px solid #ccc; 
  border-radius: 6px; 
}

.add-task button { 
  padding: 6px 12px; 
  border: none; 
  border-radius: 6px; 
  background: #333; 
  color: #fff; 
  cursor: pointer; 
}

.add-task button:hover { background: #555; }

.switch { position: relative; display: inline-block; width: 40px; height: 20px; }
.switch input { opacity: 0; width: 0; height: 0; }

.slider { 
  position: absolute; 
  cursor: pointer; 
  top: 0; left: 0; right: 0; bottom: 0; 
  background-color: #ccc; 
  border-radius: 12px; 
  transition: .2s; 
}

.slider:before { 
  position: absolute; 
  content: ""; 
  height: 14px; 
  width: 14px; 
  left: 3px; 
  bottom: 3px; 
  background-color: white; 
  border-radius: 50%; 
  transition: .2s; 
}

input:checked + .slider { background-color: #4caf50; }
input:checked + .slider:before { transform: translateX(20px); }

.archive-tools { display: flex; gap: 8px; }

.archive-tools button { 
  background: none; 
  border: none; 
  font-size: 12px; 
  cursor: pointer; 
  opacity: 0.6; 
  padding: 0; 
}

.archive-tools button:hover { opacity: 1; }

.highlighted { 
  background-color: #fff79a; 
  color: #000; 
}
</style>
</head>
