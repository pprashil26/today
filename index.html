<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Today Tool - v1.4.4</title>

<style>
* { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
body { background: #f4f4f4; padding: 20px; display: flex; justify-content: center; flex-wrap: wrap; gap: 20px; }

.card { 
  width: 300px; 
  height: 420px;
  border-radius: 12px; 
  padding: 16px; 
  display: flex; 
  flex-direction: column; 
  gap: 8px; 
  position: relative; 
  box-shadow: 0 6px 18px rgba(0,0,0,0.12); 
  overflow: hidden; 
}

.card::before { 
  content: ""; 
  position: absolute; 
  inset: 0; 
  background: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100"><rect width="100" height="100" fill="none" stroke="%23e0e0e0" stroke-width="1"/></svg>') repeat; 
  opacity: 0.03; 
  pointer-events: none; 
}

.today { background:#ffffff; background-image:linear-gradient(to bottom, rgba(0,0,0,0.08) 1px, transparent 1px); background-size:1px 24px; }
.next, .new-card { background:#dffcf0; background-image:linear-gradient(to bottom, rgba(0,0,0,0.08) 1px, transparent 1px); background-size:1px 24px; }
.someday { background:#c8f7e2; background-image:linear-gradient(to bottom, rgba(0,0,0,0.08) 1px, transparent 1px); background-size:1px 24px; }
.archive { background:#a0d9b7; background-image:linear-gradient(to bottom, rgba(0,0,0,0.08) 1px, transparent 1px); background-size:1px 24px; }

@import url('https://fonts.googleapis.com/css2?family=Patrick+Hand&display=swap');
.card h2 { font-family:'Patrick Hand',cursive; font-size:1.05rem; color:#666; display:flex; justify-content:space-between; align-items:center; }

.task-list { flex:1; overflow-y:auto; }

.add-task { display:flex; gap:4px; margin-top:8px; }
.add-task input { flex:1; padding:6px 8px; border:1px solid #ccc; border-radius:6px; }
.add-task button { padding:6px 12px; border:none; border-radius:6px; background:#333; color:#fff; cursor:pointer; }
.add-task button:hover { background:#555; }

.switch { position:relative; display:inline-block; width:40px; height:20px; }
.switch input { opacity:0; width:0; height:0; }
.slider { position:absolute; cursor:pointer; inset:0; background:#ccc; border-radius:12px; transition:.2s; }
.slider:before { content:""; position:absolute; height:14px; width:14px; left:3px; bottom:3px; background:white; border-radius:50%; transition:.2s; }
input:checked + .slider { background:#4caf50; }
input:checked + .slider:before { transform:translateX(20px); }

.archive-tools button { background:none; border:none; font-size:12px; cursor:pointer; opacity:0.6; }
.archive-tools button:hover { opacity:1; }

.highlighted { background:#fff79a; }
</style>
</head>
<body>

<div class="card today">
  <h2>
    <span>Today</span>
    <label class="switch">
      <input type="checkbox" id="toggle-cards" checked>
      <span class="slider"></span>
    </label>
  </h2>
  <div class="task-list" id="today-tasks"></div>
  <div class="add-task">
    <input type="text" id="today-input" placeholder="New task...">
    <button onclick="addTask('today')">Add</button>
  </div>
</div>

<div class="card next" id="next-card">
  <h2>Next <span class="archive-tools"><button onclick="toggleHideCard('next')">hide</button></span></h2>
  <div class="task-list" id="next-tasks"></div>
</div>

<div class="card someday" id="someday-card">
  <h2>Someday <span class="archive-tools"><button onclick="toggleHideCard('someday')">hide</button></span></h2>
  <div class="task-list" id="someday-tasks"></div>
</div>

<div class="card archive" id="archive-card">
  <h2>Archive <span class="archive-tools"><button onclick="toggleHideCard('archive')">hide</button></span></h2>
  <div class="task-list" id="archive-tasks"></div>
</div>

<div class="card new-card" id="new-card">
  <h2>
    <input type="text" id="new-card-title" style="border:none;background:none;font-family:'Patrick Hand',cursive;font-size:1rem;">
    <span class="archive-tools">
      <button onclick="toggleHideCard('new')">hide</button>
      <button onclick="prevNewCard()">Prev</button>
      <button onclick="nextNewCard()">Next</button>
      <button onclick="createNewCard()">New Card</button>
    </span>
  </h2>
  <div class="task-list" id="new-card-tasks"></div>
  <div class="add-task">
    <input type="text" id="new-card-input" placeholder="New task...">
    <button onclick="addTask('new')">Add</button>
  </div>
</div>

<script>
const storageKey='todayToolTasks';
let tasks=JSON.parse(localStorage.getItem(storageKey))||{today:[],next:[],someday:[],archive:[]};
function saveTasks(){ localStorage.setItem(storageKey,JSON.stringify(tasks)); }

const newCardsKey='newCards';
let newCards=JSON.parse(localStorage.getItem(newCardsKey))||[{title:'New Card',tasks:[]}];
let currentAdhoc=0;
function saveNewCards(){ localStorage.setItem(newCardsKey,JSON.stringify(newCards)); }

let hiddenCards={next:false,someday:false,archive:false,new:false};

document.getElementById('toggle-cards').addEventListener('change',function(){
  if(this.checked){
    hiddenCards={next:false,someday:false,archive:false,new:false};
  }
  renderVisibility();
});

function toggleHideCard(card){
  hiddenCards[card]=!hiddenCards[card];
  renderVisibility();
}

function renderVisibility(){
  const master=document.getElementById('toggle-cards').checked;
  ['next','someday','archive','new'].forEach(card=>{
    const el=(card==='new')?document.getElementById('new-card'):document.getElementById(card+'-card');
    if(!master){
      el.style.display='none';
    } else {
      el.style.display=hiddenCards[card]?'none':'flex';
    }
  });
}

document.getElementById('new-card-title').addEventListener('input',function(){
  newCards[currentAdhoc].title=this.value;
  saveNewCards();
});

function addTask(card){
  if(card==='today'){
    const text=document.getElementById('today-input').value.trim();
    if(!text) return;
    tasks.today.push({text});
    document.getElementById('today-input').value='';
    saveTasks();
  } else {
    const text=document.getElementById('new-card-input').value.trim();
    if(!text) return;
    newCards[currentAdhoc].tasks.push({text});
    document.getElementById('new-card-input').value='';
    saveNewCards();
  }
}

function prevNewCard(){ currentAdhoc=(currentAdhoc-1+newCards.length)%newCards.length; updateNewCard(); }
function nextNewCard(){ currentAdhoc=(currentAdhoc+1)%newCards.length; updateNewCard(); }
function createNewCard(){ newCards.push({title:'New Card',tasks:[]}); currentAdhoc=newCards.length-1; saveNewCards(); updateNewCard(); }

function updateNewCard(){
  document.getElementById('new-card-title').value=newCards[currentAdhoc].title;
}

renderVisibility();
updateNewCard();
</script>
</body>
</html>
