<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Task Manager</title>

<style>
body{
  font-family:Arial, sans-serif;
  margin:0;
  padding:10px;
  background:#f4f4f4;
}

.container{
  display:flex;
  flex-wrap:wrap;
  gap:10px;
}

.card{
  background:#fff;
  border-radius:8px;
  padding:10px;
  flex:1 1 300px;
  display:flex;
  flex-direction:column;
}

.card h2{
  margin:0;
  font-size:16px;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

button{
  padding:4px 8px;
  font-size:12px;
  cursor:pointer;
}

.task{
  border-bottom:1px solid #ddd;
  padding:6px 0;
  cursor:pointer;
}

.task:last-child{
  border-bottom:none;
}

.task-toolbar{
  display:none;
  margin-top:5px;
  gap:5px;
}

.chevron{
  transition:transform 0.2s ease;
}
</style>
</head>

<body>

<div class="container">

  <div class="card" id="todayCard">
    <h2>
      Today
      <button onclick="toggleAllCards()">Toggle All</button>
    </h2>
    <div id="todayTasks"></div>
  </div>

  <div class="card" id="nextCard">
    <h2>
      Next
      <button onclick="toggleCard('nextCard')">Hide</button>
    </h2>
    <div id="nextTasks"></div>
  </div>

  <div class="card" id="somedayCard">
    <h2>
      Someday
      <button onclick="toggleCard('somedayCard')">Hide</button>
    </h2>
    <div id="somedayTasks"></div>
  </div>

  <div class="card" id="archiveCard">
    <h2>
      Archive
      <div>
        <button onclick="exportTasks()">Export</button>
        <button onclick="importTasks()">Import</button>
        <button onclick="toggleCard('archiveCard')">Hide</button>
      </div>
    </h2>
    <div id="archiveTasks"></div>
  </div>

</div>

<script>
let tasks = JSON.parse(localStorage.getItem('tasks') || '[]');
let hiddenCards = JSON.parse(localStorage.getItem('hiddenCards') || '{}');
let masterVisible = true;

function save(){
  localStorage.setItem('tasks', JSON.stringify(tasks));
  localStorage.setItem('hiddenCards', JSON.stringify(hiddenCards));
}

function renderTasks(){
  const sections = {
    today: document.getElementById('todayTasks'),
    next: document.getElementById('nextTasks'),
    someday: document.getElementById('somedayTasks'),
    archive: document.getElementById('archiveTasks')
  };

  Object.values(sections).forEach(sec => sec.innerHTML='');

  tasks.forEach((task,index)=>{
    const container = sections[task.section];
    if(!container) return;

    const taskDiv = document.createElement('div');
    taskDiv.className='task';

    const topRow = document.createElement('div');
    topRow.style.display='flex';
    topRow.style.justifyContent='space-between';
    topRow.style.alignItems='center';

    const title = document.createElement('span');
    title.textContent = task.name;

    const chevron = document.createElement('span');
    chevron.className='chevron';
    chevron.textContent='▶';

    topRow.append(title, chevron);

    const toolbar = document.createElement('div');
    toolbar.className='task-toolbar';
    toolbar.style.display='none';
    toolbar.style.display='none';
    toolbar.style.flexDirection='row';

    const archiveBtn = document.createElement('button');
    archiveBtn.textContent='Archive';
    archiveBtn.onclick=(e)=>{
      e.stopPropagation();
      tasks[index].section='archive';
      save();
      renderTasks();
    };

    toolbar.appendChild(archiveBtn);

    // Toggle open/close when clicking task
    taskDiv.onclick=function(){
      const isOpen = toolbar.style.display === 'flex';
      toolbar.style.display = isOpen ? 'none' : 'flex';
      chevron.style.transform = isOpen ? 'rotate(0deg)' : 'rotate(90deg)';
    };

    taskDiv.append(topRow, toolbar);
    container.appendChild(taskDiv);
  });
}

function toggleCard(cardId){
  hiddenCards[cardId] = !hiddenCards[cardId];
  document.getElementById(cardId).style.display = hiddenCards[cardId] ? 'none' : 'flex';
  save();
}

function toggleAllCards(){
  masterVisible = !masterVisible;

  ['todayCard','nextCard','somedayCard','archiveCard'].forEach(id=>{
    document.getElementById(id).style.display = masterVisible ? 'flex' : 'none';
  });
}

function exportTasks(){
  const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(tasks));
  const dl = document.createElement('a');
  dl.setAttribute("href", dataStr);
  dl.setAttribute("download", "tasks.json");
  dl.click();
}

function importTasks(){
  const input = document.createElement('input');
  input.type='file';
  input.accept='.json';
  input.onchange = e=>{
    const file = e.target.files[0];
    const reader = new FileReader();
    reader.onload = function(event){
      tasks = JSON.parse(event.target.result);
      save();
      renderTasks();
    };
    reader.readAsText(file);
  };
  input.click();
}

function initVisibility(){
  Object.keys(hiddenCards).forEach(id=>{
    if(hiddenCards[id]){
      document.getElementById(id).style.display='none';
    }
  });
}

renderTasks();
initVisibility();
</script>

</body>
</html>
