<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Today Tool</title>

<!-- Google Fonts -->
<link href="https://fonts.googleapis.com/css2?family=Patrick+Hand&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<!-- Inter Font from Google Fonts -->
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
body { background: #f4f4f4; padding: 20px; display: flex; justify-content: center; flex-wrap: wrap; gap: 20px; }

.card { 
  width: 300px; 
  height: 420px; 
  border-radius: 12px; 
  padding: 16px; 
  display: flex; 
  flex-direction: column; 
  gap: 8px; 
  position: relative; 
  box-shadow: 0 6px 18px rgba(0,0,0,0.12); 
  overflow: hidden; 
}
.card::before { 
  content: ""; 
  position: absolute; 
  inset: 0; 
  background: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100"><rect width="100" height="100" fill="none" stroke="%23e0e0e0" stroke-width="1"/></svg>') repeat; 
  opacity: 0.03; 
  pointer-events: none; 
}

.today { background-color: #ffffff; background-image: linear-gradient(to bottom, rgba(0,0,0,0.08) 1px, transparent 1px); background-size: 1px 24px; }
.next, .new-card { background-color: #dffcf0; background-image: linear-gradient(to bottom, rgba(0,0,0,0.08) 1px, transparent 1px); background-size: 1px 24px; }
.someday { background-color: #c8f7e2; background-image: linear-gradient(to bottom, rgba(0,0,0,0.08) 1px, transparent 1px); background-size: 1px 24px; }
.archive { background-color: #a0d9b7; background-image: linear-gradient(to bottom, rgba(0,0,0,0.08) 1px, transparent 1px); background-size: 1px 24px; }

#toggle-cards-btn {
  font-size: 0.75rem;
  margin-left: 8px;
  border: none;
  background: none;
  cursor: pointer;
  color: #333;
  padding: 0;
}

.card h2 { font-family: 'Patrick Hand', cursive; font-size: 1.05rem; color: #666; display: flex; justify-content: space-between; align-items: center; }
.card h2 .first { font-weight: bold; color: #666; }
.card h2 .rest { opacity: 0.3; font-weight: normal; }
#today-date { font-size: 0.8rem; color: #888; margin-left: 6px; }

.task-list { flex: 1; overflow-y: auto; padding-right: 4px; scrollbar-width: thin; scrollbar-color: rgba(0,0,0,0.2) transparent; }
.task-list::-webkit-scrollbar { width: 6px; }
.task-list::-webkit-scrollbar-track { background: transparent; }
.task-list::-webkit-scrollbar-thumb { background-color: rgba(0,0,0,0.2); border-radius: 3px; }

.task { display: flex; flex-direction: column; padding: 6px 4px; margin-bottom: 2px; cursor: pointer; }
.task-top { display: flex; align-items: center; justify-content: space-between; }
.circle { width: 18px; height: 18px; border-radius: 50%; border: 2px solid #999; margin-right: 6px; flex-shrink: 0; display: inline-flex; align-items:center; justify-content:center; font-size:12px; font-weight:bold; transition: all 0.2s ease; background: #fff; color: #333; }
.task-text { flex: 1; word-break: break-word; font-size: 0.9rem; }
.task-toolbar { display: none; margin-left: 24px; margin-top: 2px; gap: 6px; }
.task-toolbar button { padding: 0; font-size: 0.7rem; border: none; background: none; opacity: 0.5; cursor: pointer; transition: opacity 0.15s ease; }

.add-task { display: flex; gap: 4px; margin-top: 8px; z-index: 1; position: relative; }
.add-task input { flex: 1; padding: 6px 8px; border: 1px solid #ccc; border-radius: 6px; }
.add-task button { padding: 6px 12px; border: none; border-radius: 6px; background: #333; color: #fff; cursor: pointer; }
.add-task button:hover { background: #555; }

.signifiers { margin-top: 4px; display: flex; gap: 6px; }
.signifiers button { padding: 2px 6px; border: 1px solid #ccc; border-radius: 6px; background: #f9f9f9; cursor: pointer; font-size: 0.9rem; }

.circle.completed { background: #34c759; border: none; color: white; }
.task-text.completed { opacity: 0.65; text-decoration: line-through; text-decoration-thickness: 1px; text-decoration-color: #c7c7cc; transition: all 0.25s ease; }

.highlighted { background-color: #fff79a; color: #000; }
.red-highlighted { background-color: #FF746C; color: #000; }

/* Mobile responsiveness */
@media (max-width: 600px) {
  body { flex-direction: column; align-items: center; padding: 14px; gap: 18px; background: #f2f2f7; }
  .card { width: 100%; max-width: 420px; height: 480px; border-radius: 18px; }
  .task { padding: 10px 6px; }
  .circle { width: 22px; height: 22px; font-size: 14px; }
  .task-text { font-size: 1rem; }
  .add-task input { padding: 10px 12px; font-size: 1rem; border-radius: 10px; }
  .add-task button { padding: 10px 14px; font-size: 0.95rem; border-radius: 10px; }
}
  * {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  font-family: 'Inter', sans-serif;
}
</style>
</head>

<body>

<!-- Today Card -->
<div class="card today" id="today-card">
  <h2>
    <span><span class="first">T</span><span class="rest">oday</span><span id="today-date"></span></span>
    <button id="toggle-cards-btn">Focus Mode</button>
    <button id="today-sort-btn" style="margin-left:8px; border:none; background:none; cursor:pointer; font-size:0.75rem; color:#333;">Sort A→Z</button>
  </h2>
  <div class="task-list" id="today-tasks"></div>
  <div id="today-summary" style="margin-top:6px; font-size:0.85rem; color:#555;"></div>

  <div class="add-task">
    <input type="text" placeholder="New task..." id="today-input">
    <button onclick="addTask('today')">Add</button>
  </div>

  <!-- Signifiers below input -->
  <div class="signifiers" id="today-signifiers">
    <button onclick="selectSignifier('today','❗️')">❗️</button>
    <button onclick="selectSignifier('today','‼️')">‼️</button>
    <button onclick="selectSignifier('today','📆')">📆</button>
    <button onclick="selectSignifier('today','📝')">📝</button>
    <button onclick="selectSignifier('today','💡')">💡</button>
  </div>
</div>

<!-- Next Card -->
<div class="card next" id="next-card">
  <h2>
    <span><span class="first">N</span><span class="rest">ext / this week</span></span>
    <span class="archive-tools"><button onclick="toggleHideCard('next')">hide</button></span>
  </h2>
  <div class="task-list" id="next-tasks"></div>
</div>

<!-- Someday Card -->
<div class="card someday" id="someday-card">
  <h2>
    <span><span class="first">S</span><span class="rest">omeday / notes</span></span>
    <span class="archive-tools"><button onclick="toggleHideCard('someday')">hide</button></span>
  </h2>
  <div class="task-list scrollable" id="someday-tasks"></div>
</div>

<!-- Archive Card -->
<div class="card archive" id="archive-card">
  <h2>
    Archive
    <span class="archive-tools">
      <button onclick="exportTasksTxt()">Export</button>
      <button onclick="exportReadableTxt()">Export (Readable)</button>
      <button onclick="importTasksFile()">Import</button>
      <button onclick="toggleHideCard('archive')">hide</button>
    </span>
  </h2>
  <div class="task-list" id="archive-tasks"></div>
</div>

<!-- New Card Section -->
<div class="card new-card" id="new-card-container">
  <h2>
    <span><span class="first">N</span><span class="rest">ew Card</span></span>
    <button onclick="addNewCard()">+ Add Card</button>
    <button onclick="prevNewCard()">◀</button>
    <button onclick="nextNewCard()">▶</button>
  </h2>
  <div class="task-list" id="new-card-tasks"></div>

  <div class="add-task">
    <input type="text" placeholder="New task..." id="new-card-input">
    <button onclick="addTask('new')">Add</button>
  </div>

  <div class="signifiers" id="new-signifiers">
    <button onclick="selectSignifier('new','❗️')">❗️</button>
    <button onclick="selectSignifier('new','‼️')">‼️</button>
    <button onclick="selectSignifier('new','📆')">📆</button>
    <button onclick="selectSignifier('new','📝')">📝</button>
    <button onclick="selectSignifier('new','💡')">💡</button>
  </div>
</div>

<script>
// ==========================
// TASK DATA WITH PERSISTENCE
// ==========================
let tasks = JSON.parse(localStorage.getItem('tasks')) || { today: [], next: [], someday: [], archive: [], new: [] };
let newCards = JSON.parse(localStorage.getItem('newCards')) || [{ title: "New Card", tasks: [] }];
let currentNewIndex = 0;
let selectedSignifiers = { today: '', new: '' };

// ================
// UTILITY FUNCTIONS
// ================
function saveTasks() {
  localStorage.setItem('tasks', JSON.stringify(tasks));
  localStorage.setItem('newCards', JSON.stringify(newCards));
}

function updateDate() {
  const date = new Date();
  document.getElementById('today-date').textContent = ` ${date.toDateString()}`;
}

// ================
// TASK RENDERING
// ================
function renderTasks() {
  renderCardTasks('today', 'today-tasks');
  renderCardTasks('next', 'next-tasks');
  renderCardTasks('someday', 'someday-tasks');
  renderCardTasks('archive', 'archive-tasks');
  renderNewCard();
  updateDate();
  saveTasks();
}

function renderCardTasks(cardName, elementId) {
  const container = document.getElementById(elementId);
  container.innerHTML = '';
  tasks[cardName].forEach((task, index) => {
    const taskDiv = document.createElement('div');
    taskDiv.className = 'task';
    
    const topDiv = document.createElement('div');
    topDiv.className = 'task-top';
    
    const circle = document.createElement('div');
    circle.className = 'circle' + (task.completed ? ' completed' : '');
    circle.textContent = task.signifier || '';
    circle.onclick = () => toggleComplete(cardName, index);
    
    const text = document.createElement('div');
    text.className = 'task-text' + (task.completed ? ' completed' : '');
    text.textContent = task.text;
    
    topDiv.appendChild(circle);
    topDiv.appendChild(text);
    taskDiv.appendChild(topDiv);
    
    container.appendChild(taskDiv);
  });
}

function renderNewCard() {
  const card = newCards[currentNewIndex];
  document.getElementById('new-card-tasks').innerHTML = '';
  tasks['new'] = card.tasks;
  tasks['new'].forEach((task, idx) => {
    const taskDiv = document.createElement('div');
    taskDiv.className = 'task';
    
    const topDiv = document.createElement('div');
    topDiv.className = 'task-top';
    
    const circle = document.createElement('div');
    circle.className = 'circle' + (task.completed ? ' completed' : '');
    circle.textContent = task.signifier || '';
    circle.onclick = () => toggleComplete('new', idx);
    
    const text = document.createElement('div');
    text.className = 'task-text' + (task.completed ? ' completed' : '');
    text.textContent = task.text;
    
    topDiv.appendChild(circle);
    topDiv.appendChild(text);
    taskDiv.appendChild(topDiv);
    
    document.getElementById('new-card-tasks').appendChild(taskDiv);
  });
}

// ======================
// TASK ACTIONS
// ======================
function addTask(cardName) {
  const inputId = cardName === 'today' ? 'today-input' : 'new-card-input';
  const input = document.getElementById(inputId);
  if (!input.value.trim()) return;
  const taskObj = { text: input.value, completed: false, signifier: selectedSignifiers[cardName] || '' };
  
  if(cardName === 'new') {
    newCards[currentNewIndex].tasks.push(taskObj);
    tasks['new'] = newCards[currentNewIndex].tasks;
  } else {
    tasks[cardName].push(taskObj);
  }
  
  input.value = '';
  selectedSignifiers[cardName] = '';
  renderTasks();
}

function toggleComplete(cardName, index) {
  tasks[cardName][index].completed = !tasks[cardName][index].completed;
  renderTasks();
}

function selectSignifier(cardName, symbol) {
  selectedSignifiers[cardName] = symbol;
}

// ======================
// NEW CARD NAVIGATION
// ======================
function addNewCard() {
  newCards.push({ title: "New Card", tasks: [] });
  currentNewIndex = newCards.length -1;
  renderTasks();
}

function nextNewCard() {
  if(currentNewIndex < newCards.length -1) currentNewIndex++;
  renderTasks();
}

function prevNewCard() {
  if(currentNewIndex > 0) currentNewIndex--;
  renderTasks();
}

// ======================
// EXPORT / IMPORT
// ======================
function exportTasksTxt() {
  const blob = new Blob([JSON.stringify(tasks)], {type: "text/plain;charset=utf-8"});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'tasks.json';
  a.click();
}

function exportReadableTxt() {
  let output = '';
  for(let card in tasks){
    output += card.toUpperCase() + '\n';
    tasks[card].forEach(t => {
      output += `- [${t.completed ? 'x' : ' '}] ${t.signifier || ''} ${t.text}\n`;
    });
    output += '\n';
  }
  const blob = new Blob([output], {type: "text/plain;charset=utf-8"});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'tasks_readable.txt';
  a.click();
}

function importTasksFile() {
  const input = document.createElement('input');
  input.type = 'file';
  input.accept = '.json,.txt';
  input.onchange = e => {
    const file = e.target.files[0];
    const reader = new FileReader();
    reader.onload = evt => {
      try {
        const imported = JSON.parse(evt.target.result);
        tasks = imported;
        renderTasks();
      } catch(err) {
        alert('Invalid file format.');
      }
    };
    reader.readAsText(file);
  };
  input.click();
}

// ======================
// INITIALIZATION
// ======================
document.addEventListener('DOMContentLoaded', () => {
  updateDate();
  renderTasks();
});
</script>
</body>
</html>
