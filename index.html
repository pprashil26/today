<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Today</title>
<link href="https://fonts.googleapis.com/css2?family=Patrick+Hand&display=swap" rel="stylesheet">

<style>
body {
  font-family: 'Patrick Hand', cursive;
  background: #fafafa;
  margin: 0;
  padding: 20px;
}

.card {
  background: white;
  padding: 15px;
  margin-bottom: 15px;
  border-radius: 8px;
  border: 1px solid #e5e5e5;
}

.card h2 {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin: 0 0 10px 0;
  font-size: 1.4rem;
}

.card h2 .first {
  font-size: 1.6rem;
}

.card h2 .rest {
  opacity: 0.6;
}

.archive-tools button {
  margin-left: 6px;
}

.task-list {
  margin-bottom: 10px;
}

.add-task input {
  width: 70%;
}

.add-task button {
  margin-left: 5px;
}
</style>
</head>

<body>

<!-- Today -->
<div class="card">
  <h2>
    <span><span class="first">T</span><span class="rest">oday</span></span>
    <span class="archive-tools">
      <button onclick="toggleHideCard('today')">hide</button>
    </span>
  </h2>
  <div class="task-list" id="today-tasks"></div>
</div>

<!-- Next -->
<div class="card">
  <h2>
    <span><span class="first">N</span><span class="rest">ext</span></span>
    <span class="archive-tools">
      <button onclick="toggleHideCard('next')">hide</button>
    </span>
  </h2>
  <div class="task-list" id="next-tasks"></div>
</div>

<!-- Someday -->
<div class="card">
  <h2>
    <span><span class="first">S</span><span class="rest">omeday</span></span>
    <span class="archive-tools">
      <button onclick="toggleHideCard('someday')">hide</button>
    </span>
  </h2>
  <div class="task-list" id="someday-tasks"></div>
</div>

<!-- ✅ Archive (UPDATED TITLE STYLE ONLY) -->
<div class="card archive" id="archive-card">
  <h2>
    <span><span class="first">A</span><span class="rest">rchive</span></span>
    <span class="archive-tools">
      <button onclick="exportTasksTxt()">Export</button>
      <button onclick="importTasksTxt()">Import</button>
      <button onclick="toggleHideCard('archive')">hide</button>
    </span>
  </h2>
  <div class="task-list" id="archive-tasks"></div>
</div>

<!-- ✅ New Card (UPDATED TITLE STYLE ONLY) -->
<div class="card new-card" id="new-card">
  <h2>
    <span>
      <span class="first">N</span>
      <span class="rest">
        <input type="text"
               id="new-card-title"
               value="ew Card"
               style="border:none;background:none;font-family:'Patrick Hand',cursive;font-size:1.4rem;opacity:0.6;width:140px;">
      </span>
    </span>
    <span class="archive-tools">
      <button onclick="toggleHideCard('new')">hide</button>
      <button onclick="prevNewCard()">Prev</button>
      <button onclick="nextNewCard()">Next</button>
      <button onclick="createNewCard()">New Card</button>
    </span>
  </h2>

  <div class="task-list" id="new-card-tasks"></div>

  <div class="add-task">
    <input type="text" placeholder="New task..." id="new-card-input">
    <button onclick="addTask('new')">Add</button>
  </div>
</div>

<script>
// Your original JS remains unchanged here
</script>

</body>
</html>
