<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Today Tool - v1.1 FINAL Minimal Unlimited Tasks</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
body { background: #f4f4f4; padding: 20px; display: flex; justify-content: center; flex-wrap: wrap; gap: 20px; }

.card { width: 300px; border-radius: 12px; padding: 16px; display: flex; flex-direction: column; gap: 8px; position: relative; background-size: 100% 24px; box-shadow: 0 6px 18px rgba(0,0,0,0.12); overflow: hidden; }
.card::before { content: ""; position: absolute; inset: 0; background: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100"><rect width="100" height="100" fill="none" stroke="%23e0e0e0" stroke-width="1"/></svg>') repeat; opacity: 0.03; pointer-events: none; }

.today { background-color: #ffffff; background-image: linear-gradient(to bottom, #eaeaea 1px, transparent 1px); }
.next { background-color: #dffcf0; background-image: linear-gradient(to bottom, #c8f7e2 1px, transparent 1px); }
.completed-card { background-color: #c8f7e2; background-image: linear-gradient(to bottom, #b0ebd6 1px, transparent 1px); }

@import url('https://fonts.googleapis.com/css2?family=Patrick+Hand&display=swap');
.card h2 { font-family: 'Patrick Hand', cursive; font-size: 1.15rem; color: #555; display: flex; justify-content: space-between; align-items: center; }

.task { display: flex; align-items: center; justify-content: space-between; padding: 8px 6px; border-radius: 6px; margin-bottom: 4px; background: rgba(255,255,255,0.6); box-shadow: 2px 2px 4px rgba(0,0,0,0.06); position: relative; z-index: 1; }

.circle { width: 18px; height: 18px; border-radius: 50%; border: 2px solid #999; margin-right: 8px; flex-shrink: 0; cursor: pointer; display: inline-flex; align-items:center; justify-content:center; font-size:12px; font-weight:bold; transition: all 0.2s ease; }
.circle.default { background: transparent; color: #333; }
.circle.completed { background: #4caf50; color: #fff; }
.circle.inprogress { background: #ffc107; color: #333; }

.task-text { flex: 1; margin-right: 8px; word-break: break-word; }

.task-buttons button { margin-left: 4px; padding: 2px 6px; font-size: 0.75rem; border: none; border-radius: 6px; cursor: pointer; background: rgba(0,0,0,0.05); transition: 0.2s; }
.task-buttons button:hover { background: rgba(0,0,0,0.1); }

.delete-btn { margin-left: 4px; padding: 1px 4px; font-size: 0.65rem; border: none; border-radius: 4px; cursor: pointer; background: rgba(255,0,0,0.2); color: #900; }
.delete-btn:hover { background: rgba(255,0,0,0.4); }

.add-task { display: flex; gap: 4px; margin-top: 8px; z-index: 1; position: relative; }
.add-task input { flex: 1; padding: 6px 8px; border: 1px solid #ccc; border-radius: 6px; }
.add-task button { padding: 6px 12px; border: none; border-radius: 6px; background: #333; color: #fff; cursor: pointer; }
.add-task button:hover { background: #555; }

.carry-over-btn { margin-top: 8px; padding: 6px 12px; border: none; border-radius: 6px; background: #a0cfa0; color: #fff; cursor: pointer; z-index: 1; position: relative; }
.carry-over-btn:hover { background: #91bf91; }

/* Minimal toggle switch */
.switch { position: relative; display: inline-block; width: 40px; height: 20px; }
.switch input { opacity: 0; width: 0; height: 0; }
.slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #ccc; border-radius: 12px; transition: .2s; }
.slider:before { position: absolute; content: ""; height: 14px; width: 14px; left: 3px; bottom: 3px; background-color: white; border-radius: 50%; transition: .2s; }
input:checked + .slider { background-color: #4caf50; }
input:checked + .slider:before { transform: translateX(20px); }
</style>
</head>
<body>

<div class="card today">
  <h2>
    <span>Today - <span id="today-date"></span></span>
    <label class="switch" title="Show Next & Completed cards">
      <input type="checkbox" id="toggle-cards" checked>
      <span class="slider"></span>
    </label>
  </h2>
  <div class="task-list" id="today-tasks"></div>
  <div class="add-task">
    <input type="text" placeholder="New task..." id="today-input">
    <button onclick="addTask('today')">Add</button>
  </div>
  <button class="carry-over-btn" onclick="carryOverToday()">Carry Over Unfinished Tasks</button>
</div>

<div class="card next" id="next-card">
  <h2>Next</h2>
  <div class="task-list" id="next-tasks"></div>
</div>

<div class="card completed-card" id="completed-card">
  <h2>Completed</h2>
  <div class="task-list" id="completed-tasks"></div>
</div>

<script>
function todayDate() {
  const d = new Date();
  return d.toLocaleDateString(undefined, { weekday: 'short', month: 'short', day: 'numeric', year:'numeric' });
}
document.getElementById('today-date').innerText = todayDate();

const storageKey = 'todayToolTasks';
let tasks = JSON.parse(localStorage.getItem(storageKey)) || { today: [], next: [], completed: [] };
if(tasks.someday) { tasks.completed = tasks.someday; delete tasks.someday; localStorage.setItem(storageKey, JSON.stringify(tasks)); }

function saveTasks(){ localStorage.setItem(storageKey, JSON.stringify(tasks)); }

function renderTasks() {
  ['today','next','completed'].forEach(card => {
    const container = document.getElementById(card+'-tasks');
    container.innerHTML = '';
    tasks[card].forEach((task, idx) => {
      const taskDiv = document.createElement('div'); taskDiv.className='task';
      const circle = document.createElement('span'); 
      circle.className='circle '+(task.status||'default');
      circle.textContent = task.status==='completed'?'✓':task.status==='inprogress'?'→':'•';
      circle.title = task.status || 'No status';
      circle.onclick = ()=>toggleStatus(card,idx);
      const text = document.createElement('span'); text.className='task-text'; text.textContent=task.text;

      const btnDiv = document.createElement('div'); btnDiv.className='task-buttons';

      if(card==='today'){
        const nextBtn=document.createElement('button'); nextBtn.textContent='N'; nextBtn.dataset.idx=idx;
        nextBtn.onclick=function(){ moveTask('today','next',Number(this.dataset.idx)); };
        const completedBtn=document.createElement('button'); completedBtn.textContent='C'; completedBtn.dataset.idx=idx;
        completedBtn.onclick=function(){ moveTask('today','completed',Number(this.dataset.idx)); };
        btnDiv.append(nextBtn,completedBtn);
      } else if(card==='next'){
        const todayBtn=document.createElement('button'); todayBtn.textContent='T'; todayBtn.dataset.idx=idx;
        todayBtn.onclick=function(){ moveTask('next','today',Number(this.dataset.idx)); };
        const completedBtn=document.createElement('button'); completedBtn.textContent='C'; completedBtn.dataset.idx=idx;
        completedBtn.onclick=function(){ moveTask('next','completed',Number(this.dataset.idx)); };
        btnDiv.append(todayBtn,completedBtn);
      } else if(card==='completed'){
        const todayBtn=document.createElement('button'); todayBtn.textContent='T'; todayBtn.dataset.idx=idx;
        todayBtn.onclick=function(){ moveTask('completed','today',Number(this.dataset.idx)); };
        const nextBtn=document.createElement('button'); nextBtn.textContent='N'; nextBtn.dataset.idx=idx;
        nextBtn.onclick=function(){ moveTask('completed','next',Number(this.dataset.idx)); };
        btnDiv.append(todayBtn,nextBtn);
      }

      const delBtn=document.createElement('button'); delBtn.className='delete-btn'; delBtn.textContent='✕';
      delBtn.dataset.idx=idx; delBtn.onclick=function(){ deleteTask(card,Number(this.dataset.idx)); };
      btnDiv.appendChild(delBtn);

      taskDiv.append(circle,text,btnDiv); container.appendChild(taskDiv);
    });
  });
}

function addTask(card){
  if(card!=='today') return;
  const input=document.getElementById(card+'-input'); const text=input.value.trim();
  if(!text) return; // Removed 10-task limit
  tasks[card].push({ text:text, status:'' }); input.value=''; saveTasks(); renderTasks();
}

function toggleStatus(card,idx){
  const statusOrder=['','completed','inprogress'];
  let current=tasks[card][idx].status;
  let nextIndex=(statusOrder.indexOf(current)+1)%statusOrder.length;
  tasks[card][idx].status=statusOrder[nextIndex]; saveTasks(); renderTasks();
}

function moveTask(from,to,idx){
  const [task]=tasks[from].splice(idx,1); tasks[to].push(task); saveTasks(); renderTasks();
}

function deleteTask(card,idx){ tasks[card].splice(idx,1); saveTasks(); renderTasks(); }

function carryOverToday(){
  const unfinished=tasks['today'].filter(t=>t.status===''||t.status==='inprogress');
  if(unfinished.length===0){ alert('No unfinished tasks to carry over'); return; }
  tasks['today'].push(...unfinished); saveTasks(); renderTasks(); alert(`${unfinished.length} task(s) carried over to Today`);
}

// Toggle visibility of Next & Completed cards
document.getElementById('toggle-cards').addEventListener('change', function(){
  const show = this.checked;
  document.getElementById('next-card').style.display = show ? 'flex' : 'none';
  document.getElementById('completed-card').style.display = show ? 'flex' : 'none';
});

renderTasks();
</script>
</body>
</html>
