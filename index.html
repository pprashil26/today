<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Today Tool - v1.9.5</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
body { background: #f4f4f4; padding: 20px; display: flex; justify-content: center; flex-wrap: wrap; gap: 20px; }

.card { 
  width: 100%;
  max-width: 320px;
  min-height: 420px;
  border-radius: 12px; 
  padding: 16px; 
  display: flex; 
  flex-direction: column; 
  gap: 8px; 
  position: relative; 
  box-shadow: 0 6px 18px rgba(0,0,0,0.12); 
  overflow: hidden; 
}
.card::before { 
  content: ""; 
  position: absolute; 
  inset: 0; 
  background: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100"><rect width="100" height="100" fill="none" stroke="%23e0e0e0" stroke-width="1"/></svg>') repeat; 
  opacity: 0.03; 
  pointer-events: none; 
}

.today { background-color: #ffffff; background-image: linear-gradient(to bottom, rgba(0,0,0,0.08) 1px, transparent 1px); background-size: 1px 24px; }
.next, .new-card { background-color: #dffcf0; background-image: linear-gradient(to bottom, rgba(0,0,0,0.08) 1px, transparent 1px); background-size: 1px 24px; }
.someday { background-color: #c8f7e2; background-image: linear-gradient(to bottom, rgba(0,0,0,0.08) 1px, transparent 1px); background-size: 1px 24px; }
.archive { background-color: #a0d9b7; background-image: linear-gradient(to bottom, rgba(0,0,0,0.08) 1px, transparent 1px); background-size: 1px 24px; }

@import url('https://fonts.googleapis.com/css2?family=Patrick+Hand&display=swap');
.card h2 { font-family: 'Patrick Hand', cursive; font-size: 1.05rem; color: #666; display: flex; justify-content: space-between; align-items: center; }
.card h2 .first { font-weight: bold; color: #666; }
.card h2 .rest { opacity: 0.3; font-weight: normal; }
#today-date { font-size: 0.8rem; color: #888; margin-left: 6px; }

.task-list { flex: 1; overflow-y: auto; padding-right: 4px; scrollbar-width: thin; scrollbar-color: rgba(0,0,0,0.2) transparent; }
.task-list::-webkit-scrollbar { width: 6px; }
.task-list::-webkit-scrollbar-track { background: transparent; }
.task-list::-webkit-scrollbar-thumb { background-color: rgba(0,0,0,0.2); border-radius: 3px; }

.task { display: flex; flex-direction: column; padding: 6px 4px; margin-bottom: 2px; cursor: pointer; }
.task-top { display: flex; align-items: center; justify-content: space-between; }
.circle { width: 20px; height: 20px; border-radius: 50%; border: 2px solid #999; margin-right: 6px; flex-shrink: 0; display: inline-flex; align-items:center; justify-content:center; font-size:12px; font-weight:bold; transition: all 0.2s ease; background: #fff; color: #333; }
.task-text { flex: 1; word-break: break-word; font-size: 0.9rem; }
.task-toolbar { display: none; margin-left: 24px; margin-top: 2px; gap: 6px; }
.task-toolbar button { padding: 2px 4px; font-size: 0.8rem; border: none; background: none; opacity: 0.5; cursor: pointer; transition: opacity 0.15s ease; }
.task-toolbar button:hover { opacity: 0.8; }
.chevron { font-size: 12px; margin-left: 6px; transition: transform 0.2s ease; }

.add-task { display: flex; gap: 4px; margin-top: 8px; z-index: 1; position: relative; }
.add-task input { flex: 1; padding: 6px 8px; border: 1px solid #ccc; border-radius: 6px; font-size:16px; }
.add-task button { padding: 6px 12px; border: none; border-radius: 6px; background: #333; color: #fff; cursor: pointer; }
.add-task button:hover { background: #555; }

.switch { position: relative; display: inline-block; width: 40px; height: 20px; }
.switch input { opacity: 0; width: 0; height: 0; }
.slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #ccc; border-radius: 12px; transition: .2s; }
.slider:before { position: absolute; content: ""; height: 14px; width: 14px; left: 3px; bottom: 3px; background-color: white; border-radius: 50%; transition: .2s; }
input:checked + .slider { background-color: #4caf50; }
input:checked + .slider:before { transform: translateX(20px); }

.archive-tools { display: flex; gap: 8px; }
.archive-tools button { background: none; border: none; font-size: 12px; cursor: pointer; opacity: 0.6; padding: 0; }
.archive-tools button:hover { opacity: 1; }

.new-card-index { background:none; border:none; font-size:12px; opacity:0.6; cursor:pointer; margin-top:4px; display:block; text-align:center; }
.new-card-index:hover { opacity:1; }

.highlighted { background-color: #fff79a; color: #000; }
.red-highlighted { background-color: #FF746C; color: #000; }

@media (max-width: 480px) {
  body { padding: 12px; gap: 12px; }
}
</style>
</head>
<body>

<!-- Today Card -->
<div class="card today">
  <h2>
    <span><span class="first">T</span><span class="rest">oday</span><span id="today-date"></span></span>
    <label class="switch" title="Show Next & Someday & Archive & New cards">
      <input type="checkbox" id="toggle-cards" checked>
      <span class="slider"></span>
    </label>
  </h2>
  <div class="task-list" id="today-tasks"></div>
  <div class="add-task">
    <input type="text" placeholder="New task..." id="today-input">
    <button onclick="addTask('today')">Add</button>
  </div>
</div>

<!-- Next Card -->
<div class="card next" id="next-card">
  <h2><span><span class="first">N</span><span class="rest">ext</span></span>
    <span class="archive-tools"><button onclick="toggleHideCard('next')">hide</button></span>
  </h2>
  <div class="task-list" id="next-tasks"></div>
</div>

<!-- Someday Card -->
<div class="card someday" id="someday-card">
  <h2><span><span class="first">S</span><span class="rest">omeday</span></span>
    <span class="archive-tools"><button onclick="toggleHideCard('someday')">hide</button></span>
  </h2>
  <div class="task-list" id="someday-tasks"></div>
</div>

<!-- Archive Card -->
<div class="card archive" id="archive-card">
  <h2>
    Archive
    <span class="archive-tools">
      <button onclick="exportTasksTxt()">Export</button>
      <button onclick="exportReadableTxt()">Export (Readable)</button>
      <button onclick="importTasksFile()">Import</button>
      <button onclick="toggleHideCard('archive')">hide</button>
    </span>
  </h2>
  <div class="task-list" id="archive-tasks"></div>
</div>

<!-- New Card Section -->
<div class="card new-card" id="new-card">
  <h2>
    <input type="text" id="new-card-title" value="New Card" style="border:none;background:none;font-family:sans-serif;font-size:1.05rem; width: 140px;">
    <span class="archive-tools">
      <button onclick="toggleHideCard('new')">hide</button>
      <button onclick="prevNewCard()">Prev</button>
      <button onclick="nextNewCard()">Next</button>
      <button onclick="createNewCard()">New Card</button>
    </span>
  </h2>
  <div class="task-list" id="new-card-tasks"></div>
  <div class="add-task">
    <input type="text" placeholder="New task..." id="new-card-input">
    <button onclick="addTask('new')">Add</button>
  </div>
  <button class="new-card-index" title="Current card index">Card 1/1</button>
</div>

<script>
// ---------------- STORAGE ----------------
const storageKey='todayToolTasks';
let tasks=JSON.parse(localStorage.getItem(storageKey))||{today:[],next:[],someday:[],archive:[]};
const newCardsKey='newCards';
let newCards=JSON.parse(localStorage.getItem(newCardsKey))||[{title:'New Card',tasks:[]}];
let currentAdhoc=0;
let hiddenCards={next:false,someday:false,archive:false,new:false};

function saveTasks(){ localStorage.setItem(storageKey,JSON.stringify(tasks)); }
function saveNewCards(){ localStorage.setItem(newCardsKey,JSON.stringify(newCards)); }

// ---------------- DATE ----------------
document.getElementById('today-date').innerText=" "+new Date().toLocaleDateString(undefined,{day:'numeric',month:'short'});

// ---------------- ADD TASK ----------------
function addTask(card){
  let input,text;
  if(card==='today'){
    input=document.getElementById('today-input');
    text=input.value.trim();
    if(!text) return;
    tasks.today.push({text,status:'',highlighted:false,red:false});
    input.value='';
    saveTasks();
  } else if(card==='new'){
    input=document.getElementById('new-card-input');
    text=input.value.trim();
    if(!text) return;
    newCards[currentAdhoc].tasks.push({text,status:'',highlighted:false,red:false});
    input.value='';
    saveNewCards();
  }
  renderTasks();
}

document.getElementById('today-input').addEventListener('keydown', e=>{ if(e.key==='Enter') addTask('today'); });
document.getElementById('new-card-input').addEventListener('keydown', e=>{ if(e.key==='Enter') addTask('new'); });

// ---------------- MASTER TOGGLE ----------------
document.getElementById('toggle-cards').addEventListener('change',function(){
  const isChecked=this.checked;
  Object.keys(hiddenCards).forEach(k=>{ if(k!=='today') hiddenCards[k]=!isChecked; });
  renderTasks();
});

// ---------------- INDIVIDUAL HIDE ----------------
function toggleHideCard(card){ hiddenCards[card]=!hiddenCards[card]; renderTasks(); }

// ---------------- MOVE / DELETE / STATUS ----------------
function moveTask(from,to,index,isNew=false){
  if(!isNew){
    const task=tasks[from].splice(index,1)[0];
    tasks[to].push(task);
    saveTasks();
  } else {
    const task=newCards[currentAdhoc].tasks.splice(index,1)[0];
    tasks[to].push(task);
    saveTasks(); saveNewCards();
  }
  renderTasks();
}

function deleteTask(card,index,isNew=false){
  if(!isNew) { tasks[card].splice(index,1); saveTasks(); }
  else { newCards[currentAdhoc].tasks.splice(index,1); saveNewCards(); }
  renderTasks();
}

function toggleStatus(card,index,isNew=false){
  let t;
  if(!isNew) t=tasks[card][index];
  else t=newCards[currentAdhoc].tasks[index];
  t.status=t.status===''? 'inprogress': t.status==='inprogress'? 'completed': '';
  if(!isNew) saveTasks(); else saveNewCards();
  renderTasks();
}

// ---------------- HIGHLIGHT ----------------
function toggleHighlight(card,index,color,isNew=false){
  let t;
  if(!isNew) t=tasks[card][index]; else t=newCards[currentAdhoc].tasks[index];
  if(color==='yellow'){ t.highlighted=!t.highlighted; if(t.highlighted) t.red=false; }
  if(color==='red'){ t.red=!t.red; if(t.red) t.highlighted=false; }
  if(!isNew) saveTasks(); else saveNewCards();
  renderTasks();
}

// ---------------- NEW CARD NAV ----------------
function nextNewCard(){ if(currentAdhoc<newCards.length-1) currentAdhoc++; renderTasks(); }
function prevNewCard(){ if(currentAdhoc>0) currentAdhoc--; renderTasks(); }
function createNewCard(){ newCards.push({title:'New Card',tasks:[]}); currentAdhoc=newCards.length-1; saveNewCards(); renderTasks(); }

// ---------------- EXPORT / IMPORT ----------------
function exportTasksTxt(){
  const data={tasks,newCards};
  const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='today-data.json'; a.click();
}
function exportReadableTxt(){
  let str='';
  Object.keys(tasks).forEach(k=>{
    str+=k.toUpperCase()+'\n';
    tasks[k].forEach(t=>{ str+=`- [${t.status||' '}] ${t.text} ${t.highlighted?'⭐':''} ${t.red?'★':''}\n`; });
    str+='\n';
  });
  const blob=new Blob([str],{type:'text/plain'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='today-data.txt'; a.click();
}
function importTasksFile(){
  const input=document.createElement('input');
  input.type='file'; input.accept='.json,.txt';
  input.onchange=e=>{
    const file=e.target.files[0];
    if(!file)return;
    const reader=new FileReader();
    reader.onload=function(evt){
      try{
        const c=JSON.parse(evt.target.result);
        if(c.tasks) tasks=c.tasks;
        if(c.newCards) newCards=c.newCards;
        if(newCards.length>0) currentAdhoc=0;
        saveTasks(); saveNewCards(); renderTasks();
      }catch(err){alert('Invalid file');}
    };
    reader.readAsText(file);
  };
  input.click();
}

// ---------------- RENDER ----------------
function renderTasks(){
  function createTaskDiv(t,card,i,isNew=false){
    const taskDiv=document.createElement('div'); taskDiv.className='task';
    if(t.highlighted) taskDiv.classList.add('highlighted');
    if(t.red) taskDiv.classList.add('red-highlighted');

    const topRow=document.createElement('div'); topRow.className='task-top';
    const left=document.createElement('div'); left.style.display='flex'; left.style.alignItems='center';
    const circle=document.createElement('span'); circle.className='circle';
    circle.textContent=t.status==='completed'?'✓':t.status==='inprogress'?'→':'•';
    circle.onclick=()=>toggleStatus(card,i,isNew);
    const text=document.createElement('span'); text.className='task-text'; text.textContent=t.text;
    left.append(circle,text);
    const chevron=document.createElement('span'); chevron.className='chevron'; chevron.textContent='>'; topRow.append(left,chevron);

    const tb=document.createElement('div'); tb.className='task-toolbar';

    if(!isNew){
      if(card!=='archive'){
        const btns=['today','next','someday','archive'];
        btns.filter(b=>b!==card).forEach(b=>{
          const btn=document.createElement('button'); btn.textContent=b.charAt(0).toUpperCase();
          btn.onclick=()=>moveTask(card,b,i,false); tb.appendChild(btn);
        });
        const highlightBtn=document.createElement('button'); highlightBtn.textContent='⭐'; highlightBtn.style.opacity=t.highlighted?'1':'0.3'; highlightBtn.onclick=()=>toggleHighlight(card,i,'yellow',false);
        const redBtn=document.createElement('button'); redBtn.textContent='⭐'; redBtn.style.color="#FF746C"; redBtn.style.opacity=t.red?'1':'0.3'; redBtn.onclick=()=>toggleHighlight(card,i,'red',false);
        const editBtn=document.createElement('button'); editBtn.textContent='✎'; editBtn.onclick=function(){ const newText=prompt('Edit task:',t.text); if(newText!==null){ t.text=newText; saveTasks(); renderTasks(); }};
        tb.append(highlightBtn,redBtn,editBtn);
      } else {
        ['today','next','someday'].forEach(b=>{ const btn=document.createElement('button'); btn.textContent=b.charAt(0).toUpperCase(); btn.onclick=()=>moveTask('archive',b,i,false); tb.appendChild(btn); });
        const delBtn=document.createElement('button'); delBtn.textContent='✕'; delBtn.onclick=()=>deleteTask('archive',i,false); tb.appendChild(delBtn);
      }
    } else {
      ['today','next','someday','archive'].forEach(b=>{ const btn=document.createElement('button'); btn.textContent=b.charAt(0).toUpperCase(); btn.onclick=()=>moveTask('new',b,i,true); tb.appendChild(btn); });
      const highlightBtn=document.createElement('button'); highlightBtn.textContent='⭐'; highlightBtn.style.opacity=t.highlighted?'1':'0.3'; highlightBtn.onclick=()=>toggleHighlight(card,i,'yellow',true);
      const redBtn=document.createElement('button'); redBtn.textContent='⭐'; redBtn.style.color="#FF746C"; redBtn.style.opacity=t.red?'1':'0.3'; redBtn.onclick=()=>toggleHighlight(card,i,'red',true);
      const editBtn=document.createElement('button'); editBtn.textContent='✎'; editBtn.onclick=function(){ const newText=prompt('Edit task:',t.text); if(newText!==null){ t.text=newText; saveNewCards(); renderTasks(); }};
      tb.append(highlightBtn,redBtn,editBtn);
    }

    topRow.onclick=e=>{ if(e.target===topRow || e.target===chevron){ tb.style.display=tb.style.display==='flex'?'none':'flex'; chevron.style.transform=tb.style.display==='flex'?'rotate(90deg)':'rotate(0deg)'; } };
    taskDiv.append(topRow,tb);
    return taskDiv;
  }

  const cardsArr=['today','next','someday','archive'];
  cardsArr.forEach(c=>{
    const list=document.getElementById(c+'-tasks'); list.innerHTML='';
    if(!hiddenCards[c]) tasks[c].forEach((t,i)=>{ list.appendChild(createTaskDiv(t,c,i,false)); });
  });

  // new card
  const newCard=document.getElementById('new-card');
  if(hiddenCards['new'] || newCards.length===0){ newCard.style.display='none'; } 
  else {
    newCard.style.display='flex';
    const list=document.getElementById('new-card-tasks'); list.innerHTML='';
    newCards[currentAdhoc].tasks.forEach((t,i)=>{ list.appendChild(createTaskDiv(t,'new',i,true)); });
    document.getElementById('new-card-title').value=newCards[currentAdhoc].title;
    document.querySelector('.new-card-index').textContent=`Card ${currentAdhoc+1}/${newCards.length}`;
    document.getElementById('new-card-title').oninput=e=>{ newCards[currentAdhoc].title=e.target.value; saveNewCards(); };
  }
}

renderTasks();
</script>
</body>
</html>
