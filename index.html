<script>
// Date
function todayDate() { 
  const d=new Date(); 
  return d.toLocaleDateString(undefined,{day:'numeric',month:'short'}); 
}
document.getElementById('today-date').innerText=" "+todayDate();

// Storage
const storageKey='todayToolTasks';
let tasks=JSON.parse(localStorage.getItem(storageKey))||{
  today:[],next:[],someday:[],archive:[]
};
function saveTasks(){ 
  localStorage.setItem(storageKey,JSON.stringify(tasks)); 
}

const newCardsKey='newCards';
let newCards=JSON.parse(localStorage.getItem(newCardsKey))||[
  {title:'New Card',tasks:[]}
];
let currentAdhoc=0;
function saveNewCards(){ 
  localStorage.setItem(newCardsKey,JSON.stringify(newCards)); 
}

let hiddenCards={next:false,someday:false,archive:false,new:false};

// Master toggle
document.getElementById('toggle-cards').addEventListener('change',function(){
  if(this.checked){ 
    hiddenCards={next:false,someday:false,archive:false,new:false}; 
  }
  renderTasks();
});

// Individual hide
function toggleHideCard(card){ 
  hiddenCards[card]=!hiddenCards[card]; 
  renderTasks(); 
}

// ---------------- EXISTING TASK LOGIC ----------------

function moveTask(from,to,index){
  const task=tasks[from].splice(index,1)[0];
  tasks[to].push(task);
  saveTasks();
  renderTasks();
}

function deleteTask(card,index){
  tasks[card].splice(index,1);
  saveTasks();
  renderTasks();
}

function toggleStatus(card,index){
  const statuses=['','inprogress','completed'];
  const current=tasks[card][index].status;
  const next=statuses[(statuses.indexOf(current)+1)%statuses.length];
  tasks[card][index].status=next;
  saveTasks();
  renderTasks();
}

function toggleHighlight(card,index){
  tasks[card][index].highlighted=!tasks[card][index].highlighted;
  saveTasks();
  renderTasks();
}

// ---------------- NEW CARD LOGIC ----------------

function moveTaskNewToExisting(target,index){
  const task=newCards[currentAdhoc].tasks.splice(index,1)[0];
  tasks[target].push(task);
  saveTasks();
  saveNewCards();
  renderTasks();
}

function toggleStatusNew(index){
  const statuses=['','inprogress','completed'];
  const current=newCards[currentAdhoc].tasks[index].status;
  const next=statuses[(statuses.indexOf(current)+1)%statuses.length];
  newCards[currentAdhoc].tasks[index].status=next;
  saveNewCards();
  renderTasks();
}

function toggleHighlightNew(index){
  newCards[currentAdhoc].tasks[index].highlighted=
    !newCards[currentAdhoc].tasks[index].highlighted;
  saveNewCards();
  renderTasks();
}

function createNewCard(){
  newCards.push({title:'New Card',tasks:[]});
  currentAdhoc=newCards.length-1;
  saveNewCards();
  renderTasks();
}

function prevNewCard(){
  if(currentAdhoc>0){
    currentAdhoc--;
    renderTasks();
  }
}

function nextNewCard(){
  if(currentAdhoc<newCards.length-1){
    currentAdhoc++;
    renderTasks();
  }
}

// ---------------- EXPORT / IMPORT ----------------

function exportTasksTxt(){
  const data={tasks,newCards};
  const blob=new Blob([JSON.stringify(data,null,2)],{type:'text/plain'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download='today-tool-backup.txt';
  a.click();
}

function importTasksTxt(){
  const input=document.createElement('input');
  input.type='file';
  input.accept='.txt';
  input.onchange=e=>{
    const file=e.target.files[0];
    const reader=new FileReader();
    reader.onload=function(evt){
      try{
        const data=JSON.parse(evt.target.result);
        if(data.tasks) tasks=data.tasks;
        if(data.newCards) newCards=data.newCards;
        saveTasks();
        saveNewCards();
        renderTasks();
      }catch(err){
        alert('Invalid file format');
      }
    };
    reader.readAsText(file);
  };
  input.click();
}

// ---------------- ADD TASK ----------------

function addTask(card){ 
  if(card==='today'){ 
    const input=document.getElementById('today-input'); 
    const text=input.value.trim(); 
    if(!text) return;
    tasks.today.push({text,status:'',highlighted:false}); 
    input.value=''; 
    saveTasks(); 
    renderTasks(); 
  } 
  else if(card==='new'){
    const input=document.getElementById('new-card-input'); 
    const text=input.value.trim(); 
    if(!text) return;
    newCards[currentAdhoc].tasks.push({text,status:'',highlighted:false});
    input.value=''; 
    saveNewCards(); 
    renderTasks();
  }
}

// Rename new card
document.getElementById('new-card-title').addEventListener('input',function(){
  newCards[currentAdhoc].title=this.value;
  saveNewCards();
});

// ---------------- RENDER ----------------
// (Keep your existing renderTasks() exactly as is here)

renderTasks();
</script>
